<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탐구 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 여름 쿨톤(Summer cool-tone) 색상환: 페리윙클 블루 · 라벤더 퍼플 · 더스티 로즈 ·
       머스티드 골드가 서로 어울리는 저채도·쿨톤 배색입니다. */
    --bg:#F4F3FA;
    --surface:#FFFFFF;
    --surface-alt:#ECEAF6;
    --border:#DAD6EC;
    --ink:#2E2A45;
    --ink-soft:#6B6690;
    --ink-faint:#A29CC2;
    --accent:#6C7FD8;
    --accent2:#9B7FC7;
    --accent-strong:#5163C4;
    --accent-soft:#E7E7FA;
    --accent-soft-border:#C9C6EC;
    --amber:#D9A441;
    --amber-soft:#F7ECD6;
    --amber-soft-border:#E9D4A0;
    --danger:#D65C82;
    --danger-soft:#FBE3EC;
    --danger-soft-border:#F0C2D4;
    --locked:#A6A0BE;
    --locked-soft:#F1EFF7;
    --locked-soft-border:#DFDAEC;
    --shadow: 0 2px 8px rgba(108,127,216,.08), 0 10px 26px rgba(46,42,69,.06);
    --radius: 18px;
    --heading: 'Jua', 'Noto Sans KR', sans-serif;
    --sans: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    --mono: 'JetBrains Mono', 'Roboto Mono', ui-monospace, monospace;
    /* 축하 팝업 전용 색상 — 배경의 여름 쿨톤과 대비되도록 봄 브라이트톤(선명하고
       따뜻한 고채도 색)에서 골랐습니다. 테마(라이트/다크)와 무관하게 고정입니다. */
    --cheer-coral:#FF6F61;
    --cheer-yellow:#FFD93D;
    --cheer-green:#7ED957;
    --cheer-turquoise:#2EC4B6;
    --cheer-orange:#FF9F1C;
    --cheer-pink:#FF5C8A;
  }
  /* 이 페이지는 항상 라이트 모드 배경으로 표시됩니다(시스템 다크 모드 설정과
     무관). 다만 Artifact 뷰어 등에서 사람이 직접 다크 테마를 선택한 경우를
     위해 :root[data-theme="dark"] 규칙은 그대로 남겨둡니다. */
  :root[data-theme="dark"]{
    --bg:#171626;
    --surface:#201F35;
    --surface-alt:#272640;
    --border:#3A3856;
    --ink:#EDEBFA;
    --ink-soft:#B4AFD4;
    --ink-faint:#827CA3;
    --accent:#8E9DF0;
    --accent2:#BBA0E8;
    --accent-strong:#A9B7FF;
    --accent-soft:#2C2B4C;
    --accent-soft-border:#423F6C;
    --amber:#E8BE73;
    --amber-soft:#3D3420;
    --amber-soft-border:#5C4C2B;
    --danger:#F08CAC;
    --danger-soft:#3D2430;
    --danger-soft-border:#5C3444;
    --locked:#8B85A8;
    --locked-soft:#262439;
    --locked-soft-border:#3A3856;
    --shadow: 0 2px 8px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:960px;
    margin:0 auto;
    padding:20px 18px 80px;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}
  h1,h2,h3,h4{font-family:var(--heading);font-weight:700;margin:0 0 6px;text-wrap:balance;color:var(--ink);}
  p{margin:0 0 10px;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);font-size:13px;}
  button, .btn{
    font-family:var(--sans);
    font-size:14.5px;
    font-weight:700;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:11px 18px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
    touch-action:manipulation;
  }
  button:hover{border-color:var(--accent);}
  button:active{transform:scale(0.97);}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px rgba(61,139,255,.28);}
  button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  button.ghost{background:transparent;}
  button.danger{color:var(--danger);border-color:var(--danger-soft-border);}
  button.danger:hover{border-color:var(--danger);}
  button.small{padding:7px 14px;font-size:12.5px;border-radius:999px;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  input, textarea, select{
    font-family:var(--sans);
    font-size:16px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 11px;
    width:100%;
  }
  @media (min-width:640px){ input, textarea, select{ font-size:14px; } }
  textarea{min-height:88px;resize:vertical;line-height:1.55;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}

  /* header / masthead */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;border-radius:var(--radius);
    padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .masthead .brand{display:flex;flex-direction:column;gap:2px;}
  .masthead .brand .subject{font-family:var(--heading);font-weight:400;font-size:22px;letter-spacing:.01em;}
  .masthead .brand .sub{font-size:12.5px;opacity:.9;}
  .masthead .who{display:flex;align-items:center;gap:8px;font-size:13px;}
  .masthead .who .badge2{background:rgba(255,255,255,.16);border-radius:8px;padding:5px 10px;font-weight:600;}
  .masthead-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .masthead-actions button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);}
  .masthead-actions button:hover{background:rgba(255,255,255,.22);border-color:#fff;}
  @media (max-width:760px){
    .masthead{flex-direction:column;align-items:stretch;}
    .masthead-actions{justify-content:flex-start;}
  }

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .card.tight{padding:14px 16px;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .hgroup{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}

  /* home */
  .home-hero{text-align:center;padding:38px 10px 8px;}
  .home-hero .eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 14px;}
  .home-hero h1{font-family:var(--heading);font-weight:400;font-size:34px;margin-top:12px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0;}
  @media (max-width:600px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 24px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease, transform .1s ease;
  }
  .role-card:hover{border-color:var(--accent);transform:translateY(-3px);}
  .role-card .icon{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:16px;margin-bottom:4px;}
  .role-card:nth-child(2) .icon{background:var(--amber-soft);}
  .role-card .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;}
  .role-card h3{font-family:var(--heading);font-weight:400;font-size:23px;margin-bottom:2px;}
  .role-card p{color:var(--ink-soft);font-size:13.5px;margin:0;}

  /* status chip */
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    padding:4px 10px 4px 8px;border-radius:999px;border:1px solid; white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .chip.st-locked{background:var(--locked-soft);border-color:var(--locked-soft-border);color:var(--locked);}
  .chip.st-locked .dot{background:var(--locked);}
  .chip.st-open{background:var(--surface-alt);border-color:var(--border);color:var(--ink-soft);}
  .chip.st-open .dot{background:var(--ink-faint);}
  .chip.st-submitted{background:var(--amber-soft);border-color:var(--amber-soft-border);color:var(--amber);}
  .chip.st-submitted .dot{background:var(--amber);}
  .chip.st-approved{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent);}
  .chip.st-approved .dot{background:var(--accent);}
  .chip.st-late{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger);}
  .chip.st-late .dot{background:var(--danger);}

  /* stage timeline */
  .stage-block{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .stage-head{
    display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface-alt);
    flex-wrap:wrap;justify-content:space-between;
  }
  .stage-head .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .stage-head .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stage-num{
    font-family:var(--heading);font-weight:900;font-size:15px;color:var(--accent);
    background:var(--accent-soft);border:1px solid var(--accent-soft-border);
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .stage-title{font-family:var(--heading);font-weight:700;font-size:16px;}
  .stage-deadline{font-size:12.5px;color:var(--ink-soft);font-family:var(--mono);}
  .stage-body{padding:16px 18px;background:var(--surface);}
  .stage-body.empty{color:var(--ink-faint);font-size:13.5px;font-style:italic;}

  /* stage stepper (student dashboard progress guide) */
  .stepper{display:flex;align-items:flex-start;gap:0;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px;}
  .stepper-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:92px;position:relative;text-align:center;}
  .stepper-step:not(:last-child)::after{
    content:'';position:absolute;top:19px;left:calc(50% + 24px);right:calc(-50% + 24px);height:3px;
    background:var(--border);z-index:0;
  }
  .stepper-step.done:not(:last-child)::after{background:var(--accent);}
  .stepper-circle{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:700;background:var(--locked-soft);border:2px solid var(--locked-soft-border);
    color:var(--locked);position:relative;z-index:1;
  }
  .stepper-step.current .stepper-circle{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .stepper-step.done .stepper-circle{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stepper-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:6px;line-height:1.3;}
  .stepper-step.current .stepper-label{color:var(--accent);}

  .save-hint{font-size:12px;color:var(--ink-faint);margin:-6px 0 12px;display:flex;align-items:center;gap:5px;}
  .hint-small{font-size:12px;color:var(--ink-faint);margin-top:-3px;margin-bottom:8px;transition:opacity .15s ease;}
  .hint-small.hidden{display:none;}
  .item-type-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-soft-border);}

  .entry{border-left:3px solid var(--border);padding:4px 0 4px 14px;margin-bottom:14px;position:relative;}
  .entry:last-child{margin-bottom:0;}
  .entry.type-feedback{border-left-color:var(--amber);}
  .entry.type-submission{border-left-color:var(--accent);}
  .entry.type-approval{border-left-color:var(--accent);}
  .entry .entry-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-faint);margin-bottom:4px;flex-wrap:wrap;}
  .entry .entry-author{font-weight:700;color:var(--ink-soft);}
  .entry .entry-text{white-space:pre-wrap;font-size:14px;}
  .item-card{
    background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-top:8px;
  }
  .item-card.tool-card{border-left:3px solid var(--amber);}
  .item-card .item-title{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .item-card .item-desc{white-space:pre-wrap;font-size:13.5px;color:var(--ink-soft);}
  .file-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .file-chip{
    display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:5px 9px;font-size:12px;text-decoration:none;color:var(--ink);
  }
  .file-chip img{width:20px;height:20px;object-fit:cover;border-radius:4px;}
  .file-chip .ic{font-size:14px;}

  .form-item{border:1px dashed var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface-alt);}
  .form-item.tool-item{border-color:var(--amber-soft-border);}
  .form-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .form-item-head .num{font-family:var(--mono);font-size:12px;color:var(--ink-faint);}
  .draft-file-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .draft-file-chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:4px 7px;font-size:11.5px;}
  .draft-file-chip button{padding:1px 5px;font-size:11px;border-radius:5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--surface-alt);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .notice{
    border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:12px;border:1px solid;
  }
  .notice.info{background:var(--surface-alt);border-color:var(--border);color:var(--ink-soft);}
  .notice.warn{background:var(--amber-soft);border-color:var(--amber-soft-border);color:var(--amber);}
  .notice.danger{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger);}
  .notice.ok{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent);}
  .teacher-only-tag{font-size:11px;font-family:var(--mono);letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:10px;font-size:13.5px;
    box-shadow:var(--shadow);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .link-btn{background:none;border:none;color:var(--accent);text-decoration:underline;padding:0;font-size:13px;cursor:pointer;}
  .backlink{margin-bottom:14px;}
  .helpbox{font-size:13px;color:var(--ink-soft);}
  .helpbox li{margin-bottom:6px;}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:2px;}
  .summary-block{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .summary-block .sname{font-family:var(--heading);font-weight:700;font-size:15.5px;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow);border:1px solid var(--border);max-height:85vh;overflow-y:auto;}

  /* reply threads */
  .reply-thread{margin-top:10px;padding-left:16px;border-left:2px dashed var(--border);}
  .reply-entry{margin-bottom:10px;font-size:13px;}
  .reply-entry .reply-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px;}
  .reply-author{font-weight:700;color:var(--ink-soft);font-size:12.5px;}
  .reply-text{white-space:pre-wrap;color:var(--ink);}
  .reply-box{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
  .reply-box textarea{min-height:52px;}
  .feedback-count-badge{font-size:11.5px;color:var(--ink-faint);}
  .voice-btn.recording{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger);animation:voicepulse 1.4s ease-in-out infinite;}
  @keyframes voicepulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }

  /* 종합 보고서 */
  .report-doc{font-size:15px;line-height:1.6;color:var(--ink);}
  .report-doc h4{margin:14px 0 6px;font-size:1.05em;}
  .report-title{font-size:1.3em;font-weight:800;margin-bottom:4px;}
  .report-meta{font-size:0.85em;color:var(--ink-faint);margin-bottom:10px;}
  .report-figure{margin:8px 0;text-align:center;}
  .report-figure img{max-width:100%;border:1px solid var(--border);border-radius:6px;}
  .report-figure-cap{font-size:0.8em;color:var(--ink-faint);margin-top:3px;}
  .report-sources{margin:0;padding-left:18px;font-size:0.9em;}

  /* 축하 팝업 */
  .celebrate-backdrop{
    position:fixed;inset:0;background:rgba(46,42,69,.55);display:flex;align-items:center;
    justify-content:center;z-index:1200;padding:20px;
  }
  .celebrate-modal{
    position:relative;background:var(--surface);border-radius:24px;padding:34px 26px 24px;
    max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow);overflow:hidden;
    animation:celebratePopIn .45s cubic-bezier(.34,1.56,.64,1);
  }
  .celebrate-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .confetti-dot{position:absolute;top:-14px;width:9px;height:9px;border-radius:2px;animation:confettiFall 1.8s ease-in infinite;}
  .confetti-dot:nth-child(odd){border-radius:50%;}
  .confetti-dot:nth-child(3n){transform:rotate(45deg);}
  .cc-coral{background:var(--cheer-coral);}
  .cc-yellow{background:var(--cheer-yellow);}
  .cc-green{background:var(--cheer-green);}
  .cc-turquoise{background:var(--cheer-turquoise);}
  .cc-orange{background:var(--cheer-orange);}
  .cc-pink{background:var(--cheer-pink);}
  .celebrate-mascot-wrap{position:relative;width:100px;height:100px;margin:4px auto 16px;}
  .mascot-face{
    width:100px;height:100px;border-radius:50%;background:var(--cheer-yellow);position:relative;
    box-shadow:0 6px 16px rgba(255,159,28,.35);animation:mascotBounce 1.1s ease-in-out infinite;
  }
  .mascot-eye{position:absolute;width:10px;height:12px;background:#3A2F1A;border-radius:50%;top:38px;}
  .mascot-eye.left{left:28px;}
  .mascot-eye.right{right:28px;}
  .mascot-cheek{position:absolute;width:14px;height:9px;background:var(--cheer-coral);border-radius:50%;opacity:.6;top:52px;}
  .mascot-cheek.left{left:15px;}
  .mascot-cheek.right{right:15px;}

<script>
(function(){

/* ============================== 유틸 ============================== */

/* ============================== 비밀번호 해시 ============================== */
// Passwords are never stored in plain text. This is a lightweight client-side

// actual password. crypto.subtle needs a secure context (HTTPS, or a local

function randomSalt(){
  var bytes = new Uint8Array(16);

  return Array.prototype.map.call(bytes, function(b){ return b.toString(16).padStart(2,'0'); }).join('');

function simpleHashFallback(text){
  var h = 0;
  for(var i=0;i<text.length;i++){ h = (Math.imul(31,h) + text.charCodeAt(i))|0; }

    }catch(err){ return Promise.resolve(simpleHashFallback(text)); }

}
function hashPassword(password, salt){ return hashSecret(salt+':'+password); }

function readFileAsDataURL(file){

    r.onerror = function(){ reject(r.error); };

var MAX_FILE_BYTES = 4*1024*1024;

/**
 * 종합 보고서에 첨부 자료(이미지/통계지도/표)를 삽입할 때, 원본 형식이
 * 무엇이든(PNG, WEBP 등) JPG/JPEG로 다시 인코딩합니다. 오프스크린
 * <canvas>에 그려서 변환하며, 투명 배경은 흰색으로 채웁니다.

function loadImageEl(dataUrl){
  return new Promise(function(resolve,reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('image load failed')); };
    img.src = dataUrl;
  });
}
function toJpegDataUrl(dataUrl, maxDim, quality){
  return loadImageEl(dataUrl).then(function(img){
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h) throw new Error('image has no dimensions');
    var scale = Math.min(1, maxDim/Math.max(w,h));
    var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,cw,ch);
    ctx.drawImage(img,0,0,cw,ch);
    return canvas.toDataURL('image/jpeg', quality||0.82);
  });
}

/* ==============================================================
   Minimal in-browser ZIP + XLSX (OOXML) reader/writer.
   No external library is used or fetched — this is a small, self-contained
   implementation built on native browser APIs only (DataView, DOMParser,
   CompressionStream/DecompressionStream 'deflate-raw'), so the file stays a
   single dependency-free HTML document. It supports exactly what this app
   needs: reading the first worksheet of a real-world .xlsx (as saved by
   Excel/한글/Google Sheets/LibreOffice — including their shared-strings
   table) and writing a small template .xlsx for download. It does not
   support the legacy binary .xls format or multi-sheet workbooks.
   ============================================================== */
function crc32(bytes){
  if(!crc32._table){
    var t = new Uint32Array(256);
    for(var n=0;n<256;n++){
      var c = n;
      for(var k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      t[n] = c >>> 0;
    }
    crc32._table = t;
  }
  var table = crc32._table, crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){ crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
async function inflateRaw(bytes){
  var ds = new DecompressionStream('deflate-raw');
  var writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function zipReadAll(arrayBuffer){
  var bytes = new Uint8Array(arrayBuffer);
  var dv = new DataView(arrayBuffer);
  var eocdOffset = -1;
  var searchFloor = Math.max(0, bytes.length - 22 - 65557);
  for(var i = bytes.length - 22; i >= searchFloor; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocdOffset = i; break; }
  }
  if(eocdOffset === -1) throw new Error('ZIP_EOCD_NOT_FOUND');
  var entryCount = dv.getUint16(eocdOffset+10, true);
  var centralDirOffset = dv.getUint32(eocdOffset+16, true);
  var files = {};
  var offset = centralDirOffset;
  for(var e=0; e<entryCount; e++){
    if(dv.getUint32(offset, true) !== 0x02014b50) break;
    var method = dv.getUint16(offset+10, true);
    var compSize = dv.getUint32(offset+20, true);
    var nameLen = dv.getUint16(offset+28, true);
    var extraLen = dv.getUint16(offset+30, true);
    var commentLen = dv.getUint16(offset+32, true);
    var localHeaderOffset = dv.getUint32(offset+42, true);
    var name = new TextDecoder().decode(bytes.subarray(offset+46, offset+46+nameLen));
    var lhNameLen = dv.getUint16(localHeaderOffset+26, true);
    var lhExtraLen = dv.getUint16(localHeaderOffset+28, true);
    var dataStart = localHeaderOffset + 30 + lhNameLen + lhExtraLen;
    var compData = bytes.subarray(dataStart, dataStart+compSize);
    if(method === 0){ files[name] = compData; }
    else if(method === 8){ files[name] = await inflateRaw(compData); }
    // other methods are extremely rare for xlsx and are skipped
    offset += 46 + nameLen + extraLen + commentLen;
  }
  return files;
}
function buildLocalFileHeader(nameBytes, dataLen, crc){
  var header = new Uint8Array(30 + nameBytes.length);
  var dv = new DataView(header.buffer);
  dv.setUint32(0, 0x04034b50, true);
  dv.setUint16(4, 20, true);
  dv.setUint16(6, 0, true);
  dv.setUint16(8, 0, true); // stored (no compression)
  dv.setUint16(10, 0, true);
  dv.setUint16(12, 0, true);
  dv.setUint32(14, crc, true);
  dv.setUint32(18, dataLen, true);
  dv.setUint32(22, dataLen, true);
  dv.setUint16(26, nameBytes.length, true);
  dv.setUint16(28, 0, true);
  header.set(nameBytes, 30);
  return header;
}
function buildZip(entries){ // entries: [{name, data: Uint8Array}], all stored (uncompressed)
  var parts = [], centralParts = [], offset = 0;

    var nameBytes = new TextEncoder().encode(entry.name);
    var crc = crc32(entry.data);
    var localHeader = buildLocalFileHeader(nameBytes, entry.data.length, crc);
    parts.push(localHeader, entry.data);
    var localOffset = offset;
    offset += localHeader.length + entry.data.length;

    var central = new Uint8Array(46 + nameBytes.length);
    var dv = new DataView(central.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 20, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint16(14, 0, true);
    dv.setUint32(16, crc, true);
    dv.setUint32(20, entry.data.length, true);
    dv.setUint32(24, entry.data.length, true);
    dv.setUint16(28, nameBytes.length, true);
    dv.setUint16(30, 0, true);
    dv.setUint16(32, 0, true);
    dv.setUint16(34, 0, true);
    dv.setUint16(36, 0, true);
    dv.setUint32(38, 0, true);
    dv.setUint32(42, localOffset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);
  });
  var centralDirStart = offset, centralDirSize = 0;
  centralParts.forEach(function(c){ parts.push(c); offset += c.length; centralDirSize += c.length; });
  var eocd = new Uint8Array(22);
  var dv2 = new DataView(eocd.buffer);
  dv2.setUint32(0, 0x06054b50, true);
  dv2.setUint16(8, entries.length, true);
  dv2.setUint16(10, entries.length, true);
  dv2.setUint32(12, centralDirSize, true);
  dv2.setUint32(16, centralDirStart, true);
  parts.push(eocd);
  var totalLen = parts.reduce(function(s,p){ return s+p.length; }, 0);
  var out = new Uint8Array(totalLen);
  var pos = 0;
  parts.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}
function xmlEscape(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function colLetterToIndex(letters){
  var idx = 0;
  for(var i=0;i<letters.length;i++){ idx = idx*26 + (letters.charCodeAt(i) - 64); }
  return idx - 1;
}
function parseSharedStrings(xmlStr){
  if(!xmlStr) return [];
  var doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
  var siNodes = doc.getElementsByTagName('si');
  var out = [];
  for(var i=0;i<siNodes.length;i++){
    var tNodes = siNodes[i].getElementsByTagName('t');
    var text = '';
    for(var j=0;j<tNodes.length;j++){ text += tNodes[j].textContent; }
    out.push(text);
  }
  return out;
}
function parseSheetRows(xmlStr, sharedStrings){
  var doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
  var rowNodes = doc.getElementsByTagName('row');
  var rows = [];
  for(var r=0;r<rowNodes.length;r++){
    var cellNodes = rowNodes[r].getElementsByTagName('c');
    var rowArr = [];
    for(var c=0;c<cellNodes.length;c++){
      var cellEl = cellNodes[c];
      var ref = cellEl.getAttribute('r') || '';
      var letters = ref.replace(/[0-9]/g,'');
      var colIdx = letters ? colLetterToIndex(letters) : c;
      var type = cellEl.getAttribute('t');
      var value = '';
      if(type === 'inlineStr'){
        var isNode = cellEl.getElementsByTagName('is')[0];
        if(isNode){
          var tNodes = isNode.getElementsByTagName('t');
          for(var k=0;k<tNodes.length;k++) value += tNodes[k].textContent;
        }
      } else {
        var vNode = cellEl.getElementsByTagName('v')[0];
        var raw = vNode ? vNode.textContent : '';
        if(type === 's'){
          var sIdx = parseInt(raw,10);
          value = (sharedStrings[sIdx] !== undefined) ? sharedStrings[sIdx] : '';
        } else {
          value = raw;
        }
      }
      rowArr[colIdx] = value;
    }
    rows.push(rowArr);
  }
  return rows;
}
async function parseXlsxToRows(arrayBuffer){
  var files = await zipReadAll(arrayBuffer);
  var sheetPath = 'xl/worksheets/sheet1.xml';
  if(!files[sheetPath]){
    var names = Object.keys(files);
    var found = null;
    for(var i=0;i<names.length;i++){ if(/^xl\/worksheets\/sheet\d+\.xml$/.test(names[i])){ found = names[i]; break; } }
    if(found) sheetPath = found;
  }
  if(!files[sheetPath]) throw new Error('NO_WORKSHEET_FOUND');
  var decoder = new TextDecoder('utf-8');
  var sharedStrings = files['xl/sharedStrings.xml'] ? parseSharedStrings(decoder.decode(files['xl/sharedStrings.xml'])) : [];
  return parseSheetRows(decoder.decode(files[sheetPath]), sharedStrings);
}
function extractRosterFromRows(rows){
  if(!rows.length) return [];
  var headerRowIdx = -1, colId = -1, colName = -1;
  for(var i=0;i<Math.min(rows.length,5);i++){
    var row = rows[i] || [];
    var idIdx = -1, nameIdx = -1;
    for(var c=0;c<row.length;c++){
      var v = (row[c]||'').toString().replace(/\s/g,'');
      if(v==='학번') idIdx = c;
      if(v==='이름') nameIdx = c;
    }
    if(idIdx!==-1 && nameIdx!==-1){ headerRowIdx=i; colId=idIdx; colName=nameIdx; break; }
  }
  if(headerRowIdx===-1){ headerRowIdx = 0; colId = 1; colName = 2; }
  var out = [];
  for(var r=headerRowIdx+1; r<rows.length; r++){
    var row = rows[r] || [];
    var id = (row[colId]===undefined||row[colId]===null) ? '' : row[colId].toString().trim();
    var name = (row[colName]===undefined||row[colName]===null) ? '' : row[colName].toString().trim();
    if(id && name) out.push({id:id, name:name});
  }
  return out;
}
function buildRosterTemplateBlob(){
  var rows = [
    ['연번','학번','이름'],
    [1,'10101','홍길동'],
    [2,'10102','김민서']
  ];
  var rowsXml = rows.map(function(row, ri){
    var cells = row.map(function(val, ci){
      var ref = String.fromCharCode(65+ci) + (ri+1);
      if(typeof val === 'number') return '<c r="'+ref+'"><v>'+val+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(val)+'</t></is></c>';
    }).join('');

  }).join('');
  var xmlMap = {
    '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '</Types>',
    '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>',
    'xl/workbook.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="학생명단" sheetId="1" r:id="rId1"/></sheets>' +
      '</workbook>',
    'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '</Relationships>',
    'xl/worksheets/sheet1.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetData>'+rowsXml+'</sheetData>' +
      '</worksheet>'
  };

/**
 * General-purpose multi-sheet .xlsx writer built on the same from-scratch
 * ZIP/OOXML plumbing as buildRosterTemplateBlob() above (no external library
 * — see the file-level note near crc32()/buildZip()). Unlike the single-sheet
 * roster template, this supports one worksheet per class so the 세특(과세특)
 * export below can hand the teacher one tab per 반.
 * sheets: [{name, rows}], rows: array of arrays of string|number|null/''.
 */
function buildXlsxWorkbook(sheets){
  function rowToXml(row, ri){
    var cells = row.map(function(val, ci){
      var ref = String.fromCharCode(65+ci) + (ri+1);
      if(val===null || val===undefined || val==='') return '';
      if(typeof val === 'number' && isFinite(val)) return '<c r="'+ref+'"><v>'+val+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(String(val))+'</t></is></c>';
    }).join('');

  }).join('');
  var wbRels = sheets.map(function(sh, i){
    return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
  }).join('');
  var xmlMap = {
    '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      contentOverrides +
      '</Types>',
    '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>',
    'xl/workbook.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>'+sheetTags+'</sheets>' +
      '</workbook>',
    'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      wbRels +
      '</Relationships>'
  };
  sheets.forEach(function(sh, i){
    var rowsXml2 = sh.rows.map(function(row, ri){ return rowToXml(row, ri); }).join('');
    xmlMap['xl/worksheets/sheet'+(i+1)+'.xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetData>'+rowsXml2+'</sheetData>' +
      '</worksheet>';
  });
  var entries2 = Object.keys(xmlMap).map(function(name){ return {name:name, data:new TextEncoder().encode(xmlMap[name])}; });
  var zipBytes2 = buildZip(entries2);
  return new Blob([zipBytes2], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/**
 * 과목별 세부능력 특기사항(세특)을 반별로 모아 하나의 엑셀 파일(반마다 시트
 * 하나씩)로 만듭니다. "반/번호" 열은 요청받은 규칙(1반 1번 → "1/1")을 따르고,
 * 아직 최종 결과물을 제출하지 않은 번호는 특기사항 칸을 비워 둡니다. 학번이
 * "1자리 학년+2자리 반+2자리 번호" 형식이 아니어서 반/번호를 알 수 없는
 * 학생은 마지막 "미분류" 시트에 학번 그대로 모아 둡니다.
 */
function buildSewtukByClassBlob(){
  var ids = Object.keys(STATE.students).sort();
  var byClass = {};
  var unclassified = [];
  ids.forEach(function(id){
    var student = STATE.students[id];
    var parts = parseStudentIdParts(id);
    if(!parts){ unclassified.push({id:id, student:student}); return; }
    var key = String(parts.classNum);
    if(!byClass[key]) byClass[key] = [];
    byClass[key].push({classNum:parts.classNum, seatNum:parts.seatNum, id:id, student:student});
  });
  function summaryFor(id, student){
    if(!hasFinalSubmission(student)) return ''; // 제출하지 않은 번호는 특기사항을 비워 둠
    var text = DRAFTS.summaryOverrides[id];
    if(text===undefined) text = generateSummaryText(student);
    return text.replace(/<[^>]+>/g,'');
  }
  var classKeys = Object.keys(byClass).sort(function(a,b){ return parseInt(a,10)-parseInt(b,10); });
  var sheets = classKeys.map(function(key){
    var list = byClass[key].sort(function(a,b){ return a.seatNum-b.seatNum; });
    var rows = [['반/번호','성명','세부능력 및 특기사항']];
    list.forEach(function(entry){
      rows.push([entry.classNum+'/'+entry.seatNum, entry.student.name, summaryFor(entry.id, entry.student)]);
    });
    return { name: key+'반', rows: rows };
  });
  if(unclassified.length){
    var rows2 = [['학번','성명','세부능력 및 특기사항']];
    unclassified.forEach(function(entry){
      rows2.push([entry.id, entry.student.name, summaryFor(entry.id, entry.student)]);
    });
    sheets.push({ name:'미분류', rows: rows2 });
  }
  if(!sheets.length) sheets.push({ name:'세특', rows:[['반/번호','성명','세부능력 및 특기사항']] });
  return buildXlsxWorkbook(sheets);
}
function doDownloadSewtukExcel(){
  var blob = buildSewtukByClassBlob();
  offerDownload((STATE.meta.subjectName||'탐구활동')+'_세특_반별.xlsx', blob);
}

   대비되도록 합니다.
   ============================================================== */
var CELEBRATE_QUEUE = [];

function queueCelebration(kind, title, sub){
  CELEBRATE_QUEUE.push({kind:kind, title:title, sub:sub});
}

/**
 * 학생이 아직 확인하지 못한(=celebratedIds에 없는) 선생님의 피드백/승인
 * 기록을 찾아 축하 팝업을 예약합니다. 여러 건이 쌓여 있어도 팝업은 한 번만
 * 띄우고(가장 의미 있는 것을 우선), 확인한 기록은 모두 celebratedIds에
 * 표시해 다음에 다시 뜨지 않게 합니다.
 */
function checkNewCelebrations(student){
  var celebrated = student.celebratedIds || (student.celebratedIds = []);
  var newOnes = student.timeline.filter(function(e){
    return (e.type==='feedback' || e.type==='approval') && e.author==='teacher' && celebrated.indexOf(e.id)===-1;
  });
  if(!newOnes.length) return;
  newOnes.forEach(function(e){ celebrated.push(e.id); });
  // "최종 승인"(탐구 전체 완료)은 일반 단계 승인과는 다른, 가장 우선순위 높은
  // 축하 팝업을 받습니다 — 서로 다른 이미지/색으로 구분됩니다.
  var finalApprovals = newOnes.filter(function(e){ return e.stage==='final' && e.type==='approval'; });
  var approvals = newOnes.filter(function(e){ return e.type==='approval' && e.stage!=='final'; });
  var feedbacks = newOnes.filter(function(e){ return e.type==='feedback'; });
  if(finalApprovals.length){
    queueCelebration('final-approval', '🎓 최종 승인 완료!',
      '모든 탐구 과정을 선생님이 최종 승인했어요. 정말 멋진 탐구였어요! 이제 발표를 준비해 볼까요?');
  } else if(approvals.length){
    var featuredA = approvals[approvals.length-1];
    var stageLabelA = (STAGE_INFO[featuredA.stage]||{}).shortLabel || '';
    queueCelebration('approval', '🎉 승인되었어요!',
      (stageLabelA? '\''+stageLabelA+'\' ':'')+'단계를 선생님이 승인했어요. 다음 단계로 힘차게 나아가 볼까요?');
  } else if(feedbacks.length){
    var featuredF = feedbacks[feedbacks.length-1];
    var stageLabelF = (STAGE_INFO[featuredF.stage]||{}).shortLabel || '';
    queueCelebration('feedback', '💌 피드백이 도착했어요!',
      (stageLabelF? '\''+stageLabelF+'\' 단계에 ':'')+'선생님이 새로운 피드백을 남겼어요. 확인해 보세요!');
  }
  saveState(true);
}

/* ============================== IndexedDB ============================== */
var DB_NAME = 'inquiry_tracker_db_v1';
var STORE = 'kv';
var _db = null;
function openDB(){
  return new Promise(function(resolve,reject){
    if(_db){ resolve(_db); return; }
    if(!window.indexedDB){ reject(new Error('no-indexeddb')); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e){
      e.target.result.createObjectStore(STORE);
    };
    req.onsuccess = function(e){ _db = e.target.result; resolve(_db); };
    req.onerror = function(e){ reject(e.target.error); };
  });
}
function dbGet(key){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(STORE,'readonly');
      var r = tx.objectStore(STORE).get(key);
      r.onsuccess = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}
function dbSet(key,val){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(STORE,'readwrite');
      var r = tx.objectStore(STORE).put(val,key);
      r.onsuccess = function(){ resolve(); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}

/**
 * This app's 학번(student id) convention, used consistently in every roster
 * placeholder/example throughout the file (e.g. "10305"): 1 digit 학년 +
 * 2-digit 반(class) + 2-digit 번호(seat number within the class). This lets
 * the 반/번호 grouping used by the by-class 세특 export be derived directly
 * from the id already on file, without needing a separate class/number field
 * per student. Returns null for ids that aren't in this 5-digit numeric shape
 * so non-conforming ids degrade gracefully instead of being mis-parsed.
 */
function parseStudentIdParts(studentId){
  var m = /^(\d)(\d{2})(\d{2})$/.exec((studentId||'').toString().trim());
  if(!m) return null;
  return { grade: parseInt(m[1],10), classNum: parseInt(m[2],10), seatNum: parseInt(m[3],10) };
}
function hasFinalSubmission(student){
  return (student.timeline||[]).some(function(e){ return e.stage==='final' && e.type==='submission'; });
}
function stageRank(status){
  return {locked:0, open:1, submitted:2, approved:3}[status] || 0;
}
function touchMeta(){ STATE.meta.updatedAt = nowISO(); }

/**
 * Upgrades state saved by the earlier 4-stage version of this file
 * (stage1/stage2/stage3/final) into the current 3-stage model
 * (stage1/research/final), where stage2+stage3 are merged into one
 * flexible "research" phase. Safe to call on already-current state (no-op).
 */
function migrateState(state){
  var changed = false;
  if(!state.meta.teachers){ state.meta.teachers = []; changed = true; }
  if(state.meta.region===undefined){ state.meta.region = ''; changed = true; }
  if(state.meta.schoolName===undefined){ state.meta.schoolName = ''; changed = true; }
  Object.keys(state.students||{}).forEach(function(id){
    var s0 = state.students[id];
    if(s0.passwordHash===undefined){ s0.passwordHash = null; changed = true; }
    if(s0.passwordSalt===undefined){ s0.passwordSalt = null; changed = true; }
    if(!s0.draft){ s0.draft = {}; changed = true; }
    if(!s0.accessLog){ s0.accessLog = []; changed = true; }
    if(!s0.celebratedIds){
      // Backfill with every existing teacher feedback/approval entry so that
      // students upgrading from an older save don't get a sudden flood of
      // celebration popups for events they already saw long ago — only
      // genuinely new events (from this point on) will pop a celebration.
      s0.celebratedIds = (s0.timeline||[]).filter(function(e){
        return (e.type==='feedback' || e.type==='approval') && e.author==='teacher';
      }).map(function(e){ return e.id; });
      changed = true;
    }
  });
  if(state.deadlines && (state.deadlines.stage2!==undefined || state.deadlines.stage3!==undefined)){
    var mergedDeadline = state.deadlines.stage2 || state.deadlines.stage3 || null;
    state.deadlines = { stage1: state.deadlines.stage1||null, research: mergedDeadline, final: state.deadlines.final||null };
    changed = true;
  }
  if(!state.deadlines) { state.deadlines = {stage1:null, research:null, final:null}; changed = true; }
  Object.keys(state.students||{}).forEach(function(id){
    var s = state.students[id];
    if(s.stageStatus && (s.stageStatus.stage2!==undefined || s.stageStatus.stage3!==undefined)){
      var rank2 = stageRank(s.stageStatus.stage2||'locked'), rank3 = stageRank(s.stageStatus.stage3||'locked');
      var best = Math.max(rank2, rank3);
      var mergedStatus = ['locked','open','submitted','approved'][best] || 'locked';
      if(mergedStatus==='approved') mergedStatus = 'submitted'; // research no longer has an 'approved' gate
      s.stageStatus = { stage1: s.stageStatus.stage1||'open', research: mergedStatus, final: s.stageStatus.final||'locked' };
      changed = true;
    }
    if(s.stageStatus && s.stageStatus.stage1==='approved'){
      // under the new model, approving stage1 opens both research and final together
      if(s.stageStatus.research==='locked'){ s.stageStatus.research='open'; changed = true; }
      if(s.stageStatus.final==='locked'){ s.stageStatus.final='open'; changed = true; }
    }
    (s.timeline||[]).forEach(function(e){
      if(e.stage==='stage2' || e.stage==='stage3'){ e.stage='research'; changed = true; }
      if(e.tools===undefined){ e.tools = []; changed = true; }
      if(e.threadRoot===undefined){ e.threadRoot = null; changed = true; }
    });
  });
  return changed;
}

  summaryOverrides:{} // studentId -> text (session-only edit buffer before save)
};
function freshStageDraft(){ return { mainText:'', items:[{title:'',description:'',files:[],itemType:''}], tools:[{name:'',reference:''}] }; }
/**
 * Where a student's in-progress (not-yet-submitted) writing lives. Backed by
 * STATE.students[id].draft so it survives page reloads, browser restarts and
 * even months between sessions — this is what lets a student close the page
 * mid-paragraph and pick up writing again later exactly where they left off.
 * Falls back to the old ephemeral DRAFTS.stageForm bucket when no student is
 * in session (shouldn't normally happen, since only the student dashboard
 * renders stage forms).
 */
function stageDraftStore(){
  if(VIEW.role==='student' && VIEW.studentId && STATE.students[VIEW.studentId]){
    var s = STATE.students[VIEW.studentId];
    if(!s.draft) s.draft = {};
    return s.draft;
  }
  return DRAFTS.stageForm;
}
function getStageDraft(stage){
  var store = stageDraftStore();
  if(!store[stage]) store[stage] = freshStageDraft();
  return store[stage];
}
function resetStageDraft(stage){ stageDraftStore()[stage] = freshStageDraft(); }
function currentTeacherName(){ return VIEW.teacherName || '교사'; }

/**
 * Updates the small "자동 저장됨" note under a stage's textarea directly via
 * the DOM (no render()), so the student sees their writing is being saved
 * without losing cursor position mid-sentence.
 */
function markAutosaved(stage){
  clearTimeout(markAutosaved._t && markAutosaved._t[stage]);
  if(!markAutosaved._t) markAutosaved._t = {};
  markAutosaved._t[stage] = setTimeout(function(){
    var note = document.getElementById('save-note-'+stage);
    if(note) note.textContent = '✅ 자동 저장됨 · 이 기기에 안전하게 보관되고 있어요.';
  }, 200);
}

/* ============================== 렌더 루트 ============================== */
function render(){
  var app = document.getElementById('app');
  app.innerHTML = renderScreen();
  bindGlobalHandlers(app);
}

function renderScreen(){
  switch(VIEW.screen){
    case 'home': return screenHome();
    case 'studentLogin': return screenStudentLogin();
    case 'teacherAuth': return screenTeacherAuth();
    case 'teacherSetup': return screenTeacherSetup();
    case 'studentDashboard': return screenStudentDashboard();
    case 'teacherDashboard': return screenTeacherDashboard();
    case 'teacherStudentDetail': return screenTeacherStudentDetail();
    case 'teacherSummary': return screenTeacherSummary();
    case 'report': return screenReport();
    default: return screenHome();
  }
}

function masthead(whoLabel, opts){

function statusChip(status, extra){
  var map = {
    locked:{cls:'st-locked', label:'잠김'},
    open:{cls:'st-open', label:'대기중'},
    submitted:{cls:'st-submitted', label:'제출됨'},
    approved:{cls:'st-approved', label:'승인됨'}
  };
  var m = map[status] || map.open;
  var label = (extra&&extra.label) || m.label;
  return '<span class="chip '+m.cls+'"><span class="dot"></span>'+escapeHtml(label)+'</span>';
}

function fileChip(f){
  var isImg = f.mime && f.mime.indexOf('image/')===0;
  return '<button type="button" class="file-chip" data-action="download-file" data-filechip-src="'+f.dataUrl+'" data-filechip-name="'+escapeHtml(f.name)+'" title="'+escapeHtml(f.name)+' 저장">' +
    (isImg ? '<img src="'+f.dataUrl+'" alt="">' : '<span class="ic">📎</span>') +
    '<span>'+escapeHtml(f.name)+'</span>' +
  '</button>';
}

function entryInnerHtml(entry){
  var typeLabel = {submission:'제출', feedback:'피드백', approval:'승인', reopen:'재검토 요청'}[entry.type] || entry.type;
  var authorLabel = entry.author==='teacher' ? (entry.authorName||'교사') : '학생';
  var itemsHtml = '';
  if(entry.items && entry.items.length){
    itemsHtml = entry.items.map(function(it, idx){
      var files = (it.files||[]).map(fileChip).join('');
      if(!it.title && !it.description && !(it.files||[]).length && !it.itemType) return '';
      var typeBadge = (it.itemType && GRAPHIC_ITEM_TYPES.indexOf(it.itemType)!==-1) ?
        '<span class="item-type-badge">'+(it.itemType==='통계지도'?'📍':'📋')+' '+escapeHtml(it.itemType)+'</span>' : '';
      return '<div class="item-card">' +
        '<div class="item-title">조사 항목 '+(idx+1)+(it.title? ' · '+escapeHtml(it.title):'')+typeBadge+'</div>' +
        (it.description? '<div class="item-desc">'+escapeHtml(it.description)+'</div>' : '') +
        (files? '<div class="file-list">'+files+'</div>' : '') +
      '</div>';
    }).join('');
  }
  var toolsHtml = '';
  if(entry.tools && entry.tools.length){
    toolsHtml = entry.tools.map(function(t, idx){
      if(!t.name && !t.reference) return '';
      return '<div class="item-card tool-card">' +
        '<div class="item-title">🔧 활용 도구 '+(idx+1)+(t.name? ' · '+escapeHtml(t.name):'')+'</div>' +
        (t.reference? '<div class="item-desc">'+escapeHtml(t.reference)+'</div>' : '') +
      '</div>';
    }).join('');
  }
  return '<div class="entry-meta"><span class="entry-author">'+authorLabel+(entry.authorName && entry.author!=='teacher'? ' · '+escapeHtml(entry.authorName):'')+'</span>' +
      '<span>· '+typeLabel+'</span>' +
      '<span class="mono">· '+fmtDateTime(entry.ts)+'</span>' +
      (entry.late? '<span class="chip st-late" style="margin-left:4px;"><span class="dot"></span>기한 초과</span>' : '') +
    '</div>' +
    (entry.mainText? '<div class="entry-text">'+escapeHtml(entry.mainText)+'</div>' : '') +
    itemsHtml + toolsHtml;
}

function timelineEntryHtml(entry){
  return '<div class="entry type-'+entry.type+'">' + entryInnerHtml(entry) + '</div>';
}

function replyEntryHtml(entry){
  var authorLabel = entry.author==='teacher' ? (entry.authorName||'교사') : (entry.authorName||'학생');
  return '<div class="reply-entry">' +
    '<div class="reply-meta"><span class="reply-author">'+escapeHtml(authorLabel)+'</span><span class="mono faint">'+fmtDateTime(entry.ts)+'</span></div>' +
    '<div class="reply-text">'+escapeHtml(entry.mainText)+'</div>' +
  '</div>';
}

/**
 * Renders one stage's entries as a chronological list, nesting any
 * 'comment' replies underneath the 'feedback' entry they respond to and
 * offering an inline reply box there. Used identically in the teacher and
 * student views so every teacher (up to the recommended 3) and the student
 * see the exact same feedback/comment thread.
 */
function renderStageEntries(entries, stage){
  var topLevel = entries.filter(function(e){ return !e.threadRoot; });
  return topLevel.map(function(entry){
    var inner = entryInnerHtml(entry);
    if(entry.type==='feedback'){
      var replies = entries.filter(function(e){ return e.threadRoot===entry.id; })
        .sort(function(a,b){ return new Date(a.ts)-new Date(b.ts); });
      var draftVal = DRAFTS.reply[entry.id] || '';
      inner += '<div class="reply-thread">' +
        replies.map(replyEntryHtml).join('') +
        '<div class="reply-box">' +
          '<textarea data-reply-input="'+entry.id+'" placeholder="이 피드백에 대한 생각이나 답변을 남겨보세요">'+escapeHtml(draftVal)+'</textarea>' +
          '<div><button type="button" class="small" data-action="send-reply" data-root="'+entry.id+'" data-stage="'+stage+'">답글 남기기</button></div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="entry type-'+entry.type+'">' + inner + '</div>';
  }).join('');
}

/**
 * 이 학급에 등록된(=한 번이라도 교사 인증 화면에서 이름을 입력해 입장한)
 * 모든 교사의 이름을 보여줍니다. 한 학급을 최대 3명(권장)의 교사가 함께
 * 사용할 수 있으므로, 로그인한 교사라면 누구든 "교사로 등록된 사람"이
 * 전부 몇 명이고 누구인지 이 대시보드에서 바로 확인할 수 있습니다.
 */
function teacherRosterHtml(){
  var teachers = STATE.meta.teachers || [];
  var me = currentTeacherName();
  var chips = teachers.map(function(name){
    var isMe = name === me;
    return '<span class="chip '+(isMe?'st-approved':'st-open')+'"><span class="dot"></span>'+escapeHtml(name)+(isMe?' (나)':'')+'</span>';
  }).join(' ');
  return '<div class="card tight">' +
    '<div class="hgroup"><h4 style="margin:0;">👩‍🏫 등록된 교사 ('+teachers.length+'명)</h4>' +
      '<span class="faint" style="font-size:12.5px;">같은 비밀번호로 입장해 이름을 등록한 모든 교사가 여기서 서로를 확인할 수 있어요</span></div>' +
    (teachers.length? '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+chips+'</div>' : '<p class="faint">아직 등록된 교사가 없습니다.</p>') +
  '</div>';
}

/**
 * 이 앱은 서버 없이 "지금 이 페이지(파일/브라우저)"에만 모든 기록을 저장합니다
 * (IndexedDB). 그래서 이 파일의 새 버전을 새로 받아 열거나, 다른 기기·다른
 * 브라우저·다른 다운로드 사본으로 열면 이전 데이터가 자동으로 이어지지
 * 않습니다 — 겉보기엔 "같은 앱"이어도, 저장 공간 입장에서는 서로 다른
 * 페이지라서 완전히 별개의 빈 저장소로 시작하기 때문입니다. 이 카드는 전체
 * 데이터(설정·학생 명단·모든 기록·비밀번호)를 하나의 .json 파일로 내려받고,
 * 그 파일을 다른 사본에서 다시 불러와 데이터를 이어갈 수 있게 해줍니다.
 */
function backupRestoreHtml(){
  return '<div class="card tight">' +
    '<div class="hgroup"><h4 style="margin:0;">💾 데이터 백업 · 복원</h4></div>' +
    '<p class="faint" style="margin:-2px 0 8px;">이 페이지는 서버 없이 <b>지금 열려 있는 이 파일(브라우저)에만</b> 모든 기록을 저장해요. 그래서 이 파일의 새 버전을 새로 받거나 다른 기기·다른 브라우저로 열면 이전 데이터가 자동으로 이어지지 않아요. 중요한 시점마다, 그리고 새 버전을 받기 <b>전</b>에는 꼭 백업 파일을 내려받고, 새 버전을 연 뒤에는 그 백업 파일을 불러와 이어가세요.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
      '<button type="button" class="small" data-action="export-backup">📥 백업 파일 내려받기(.json)</button>' +
      '<label class="small" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer;background:var(--surface);">📤 백업 파일 불러오기' +
        '<input type="file" accept=".json,application/json" data-action="restore-backup" style="display:none;">' +
      '</label>' +
    '</div>' +
  '</div>';
}

function screenTeacherDashboard(){
  var ids = Object.keys(STATE.students).sort();
  var rows = ids.map(function(id){
    var s = STATE.students[id];
    var cells = STAGE_ORDER.map(function(st){
      var status = s.stageStatus[st];
      if(st==='final' && status==='submitted' && !s.presentationEligible){
        return '<td>'+statusChip('submitted',{label:'제출(기한초과)'})+'</td>';
      }
      return '<td>'+statusChip(status)+'</td>';
    }).join('');
    return '<tr class="clickable" data-action="open-student" data-id="'+escapeHtml(id)+'">' +
      '<td class="mono">'+escapeHtml(id)+'</td><td>'+escapeHtml(s.name)+'</td>'+cells+
      '<td>'+(s.presentationEligible? '<span class="chip st-approved"><span class="dot"></span>발표 가능</span>' : '<span class="chip st-open"><span class="dot"></span>-</span>')+'</td>' +
    '</tr>';
  }).join('');

  var deadlineFields = STAGE_ORDER.map(function(st){
    var val = DRAFTS.deadlineInputs[st] !== undefined ? DRAFTS.deadlineInputs[st] : toDatetimeLocalValue(STATE.deadlines[st]);
    return '<div class="field"><label>'+(STAGE_INFO[st].num?STAGE_INFO[st].num+'차 · ':'')+STAGE_INFO[st].label+' 기한</label>' +
      '<input type="datetime-local" data-deadline-stage="'+st+'" value="'+val+'"></div>';
  }).join('');

  return masthead(currentTeacherName()) +
  teacherRosterHtml() +
  backupRestoreHtml() +
  '<div class="card">' +
    '<div class="hgroup"><h3 style="margin:0;">단계별 제출 기한</h3><button class="small" data-action="edit-subject">학급 정보 수정</button></div>' +
    '<form data-form="deadlines">' +
      '<div class="row">'+deadlineFields+'</div>' +
      '<button type="submit" class="primary">기한 저장</button>' +
    '</form>' +
  '</div>' +
  '<div class="card">' +
    '<div class="hgroup"><h3 style="margin:0;">학생 명단 ('+ids.length+'명)</h3>' +
      '<button class="small" data-action="show-summary">발표·세특 요약 보기<span class="teacher-only-tag" style="margin-left:6px;">교사 전용</span></button></div>' +
    (ids.length===0 ? '<p class="faint">아직 등록된 학생이 없습니다. 아래에서 추가하세요.</p>' : '') +
    (ids.length? '<div class="table-wrap"><table><thead><tr><th>학번</th><th>이름</th><th>1차</th><th>탐구진행</th><th>최종</th><th>발표</th></tr></thead><tbody>'+rows+'</tbody></table></div>' : '') +
  '</div>' +
  '<div class="card">' +
    '<h4>학생 추가</h4>' +
    '<div class="row">' +
      '<form data-form="add-student" class="row" style="flex:3;">' +
        '<div class="field" style="min-width:120px;"><label>학번</label><input name="studentId" placeholder="10305" value="'+escapeHtml(DRAFTS.newStudentId)+'"></div>' +
        '<div class="field" style="min-width:120px;"><label>이름</label><input name="name" placeholder="홍길동" value="'+escapeHtml(DRAFTS.newStudentName)+'"></div>' +
        '<div class="field" style="flex:0;align-self:end;"><button type="submit" class="primary">추가</button></div>' +
      '</form>' +
    '</div>' +

  // 전체를 마무리하는 최종 승인 — 이 두 단계만 승인/재검토 버튼을 가집니다.
  if(stage==='stage1'){
    var status = student.stageStatus.stage1;
    if(status==='submitted'){
      return '<button class="small primary" data-action="approve-stage" data-stage="stage1">이 단계 승인</button> ';

      return '<button class="small ghost" data-action="reopen-stage" data-stage="stage1">재검토 요청(다시 열기)</button> ';
    }
    return '';
  }
  if(stage==='final'){

    if(fstatus==='submitted'){

    }
    return '';
  }
  return '';
}

function generateSummaryText(student){
  function lastMain(stage){
    var subs = student.timeline.filter(function(e){ return e.stage===stage && e.type==='submission'; });
    return subs.length? subs[subs.length-1].mainText : '';
  }
  function feedbackCount(stage){
    return student.timeline.filter(function(e){ return e.stage===stage && e.type==='feedback' && !e.threadRoot; }).length;
  }
  function toolsUsed(){
    var names = [];
    student.timeline.forEach(function(e){
      (e.tools||[]).forEach(function(t){
        if(t.name && names.indexOf(t.name)===-1) names.push(t.name);
      });
    });
    return names;
  }
  var topic = lastMain('stage1');
  var research = lastMain('research');
  var final = lastMain('final');
  var tools = toolsUsed();
  var parts = [];
  if(topic) parts.push('‘'+topic+'’을(를) 탐구 주제로 선정하고'+(feedbackCount('stage1')? ' 교사 피드백을 반영하여 주제를 구체화함.' : '함.'));
  if(research) parts.push('서론-본론-결론의 방향을 설정하고 자료를 조사·분석하며 탐구 내용을 구체화함('+research.slice(0,70)+(research.length>70?'…':'')+').');
  if(tools.length) parts.push('탐구 과정에서 '+tools.join(', ')+' 등을 활용함.');
  if(final) parts.push('최종적으로 '+(student.presentationEligible? '기한 내 ':'')+'탐구 결과물을 완성함('+final.slice(0,80)+(final.length>80?'…':'')+').');
  parts.push(student.presentationEligible? '2학기 기말고사 이후 학급 내 탐구 발표를 진행함.' : '최종 결과물 제출이 확인되지 않아 발표 대상에서 제외됨.');
  if(!topic && !research && !final) return escapeHtml(student.name)+' 학생은 아직 탐구 활동을 시작하지 않음.';
  return escapeHtml(student.name)+' 학생은 '+parts.join(' ');
}

/* ==============================================================
   종합 보고서 (학생·교사 모두 열람 가능)
   ==============================================================
   학생이 작성한 "주제 선정 → 서론/본론/결론 → 관련 조사 항목 → 교사
   피드백 반영 → 최종 결과물(개조식)"의 전체 과정을 하나의 문서로 종합하고,
   조사 항목에 첨부된 이미지/통계지도/표 자료를 모두 JPEG로 변환해 자연스럽게
   삽입한 뒤, 사용한 도구/자료 출처를 <출처>로 정리합니다.
   A4 기본 설정(글자 10pt, 줄간격 160%) 기준 2장 분량에 맞추는 것을
   목표로 하되, 이는 화면 측정에 기반한 최선의 노력(best-effort)이며
   내용이 아주 많을 경우 일부가 요약·생략될 수 있습니다(그 경우 화면에
   안내 배너가 표시됩니다).
   ============================================================== */
var REPORT_STATE = { studentId:null, loading:false, html:null, overflow:false };

function collectAllTools(student){
  var seen = [], list = [];
  student.timeline.forEach(function(e){
    (e.tools||[]).forEach(function(t){
      if(t.name && seen.indexOf(t.name)===-1){ seen.push(t.name); list.push({name:t.name, reference:t.reference||''}); }
    });
  });
  return list;
}

function collectImageItems(student, maxCount){
  var withImages = [];
  student.timeline.forEach(function(e){
    if(e.type!=='submission') return;
    (e.items||[]).forEach(function(it){
      (it.files||[]).forEach(function(f){
        if(f.mime && f.mime.indexOf('image/')===0){
          withImages.push({stage:e.stage, title:it.title, description:it.description, itemType:it.itemType, file:f});
        }
      });
    });
  });
  // 통계지도/표로 지정된 자료와 최종 단계의 자료를 우선적으로 보여줍니다.
  var stagePriority = {research:0, stage1:1, final:2}; // 조사 항목은 이제 research 단계에서만 작성됩니다
  withImages.sort(function(a,b){
    var typeA = GRAPHIC_ITEM_TYPES.indexOf(a.itemType)!==-1 ? 0 : 1;
    var typeB = GRAPHIC_ITEM_TYPES.indexOf(b.itemType)!==-1 ? 0 : 1;
    if(typeA!==typeB) return typeA-typeB;
    var pa = stagePriority[a.stage]!==undefined ? stagePriority[a.stage] : 3;
    var pb = stagePriority[b.stage]!==undefined ? stagePriority[b.stage] : 3;
    return pa-pb;
  });
  return { list: withImages.slice(0, maxCount), totalCount: withImages.length };
}

// "Ⅰ. 서론" 같은 개조식 헤더가 있는 줄을 찾아, 서론/본론/결론 구간으로 나눕니다.
// 헤더가 전혀 없으면 null을 반환하며, 이 경우 호출부에서 전체 텍스트를 그대로 사용합니다.
function findSectionLineIndex(lines, keyword){
  for(var i=0;i<lines.length;i++){
    var stripped = lines[i].replace(/^[\s0-9ⅠⅡⅢⅣⅤⅥIVXivx가나다라마.\)\(]+/, '').trim();
    if(stripped.indexOf(keyword)===0) return i;
  }
  return -1;
}
function splitIntroBodyConclusion(text){
  if(!text) return null;
  var lines = text.split('\n');
  var iIntro = findSectionLineIndex(lines, '서론');
  var iBody = findSectionLineIndex(lines, '본론');
  var iConcl = findSectionLineIndex(lines, '결론');
  if(iIntro===-1 && iBody===-1 && iConcl===-1) return null;
  var bounds = [iIntro, iBody, iConcl].filter(function(x){ return x!==-1; }).sort(function(a,b){ return a-b; });
  function sectionText(startIdx){
    if(startIdx===-1) return '';
    var endIdx = lines.length;
    bounds.forEach(function(b){ if(b>startIdx && b<endIdx) endIdx = b; });
    return lines.slice(startIdx+1, endIdx).join('\n').trim();
  }
  return { intro: sectionText(iIntro), body: sectionText(iBody), conclusion: sectionText(iConcl) };
}

function buildReportModel(student){
  function lastSubmissionText(stage){
    var subs = student.timeline.filter(function(e){ return e.stage===stage && e.type==='submission'; });
    return subs.length ? subs[subs.length-1].mainText.trim() : '';
  }
  var topic = lastSubmissionText('stage1');
  var researchText = lastSubmissionText('research');
  var finalText = lastSubmissionText('final');

  // 최종 단계(개조식 결과물)를 최우선으로 삼고, 헤더가 없으면 탐구 진행 단계의
  // 서론/본론/결론 텍스트로 보완합니다.
  var splitFinal = splitIntroBodyConclusion(finalText);
  var splitResearch = splitIntroBodyConclusion(researchText);
  var intro = (splitFinal && splitFinal.intro) || (splitResearch && splitResearch.intro) || researchText || '';
  var body = (splitFinal && splitFinal.body) || finalText || researchText || '';
  var conclusion = (splitFinal && splitFinal.conclusion) || (splitResearch && splitResearch.conclusion) || '';

  var feedbackCount = student.timeline.filter(function(e){ return e.type==='feedback' && !e.threadRoot; }).length;
  var feedbackNote = feedbackCount>0
    ? '탐구를 진행하며 총 '+feedbackCount+'회의 교사 피드백을 반영하여 내용을 구체화하고 보완하였다.'
    : '';

  return {
    student: student,
    topic: topic,
    intro: intro,
    body: body,
    conclusion: conclusion,
    feedbackNote: feedbackNote,
    tools: collectAllTools(student),
    images: collectImageItems(student, 4)
  };
}

function buildReportModelAsync(student){
  var model = buildReportModel(student);
  return Promise.all(model.images.list.map(function(im){
    return toJpegDataUrl(im.file.dataUrl, 480, 0.82).then(function(jpeg){
      im.jpegDataUrl = jpeg; return im;
    }).catch(function(){
      im.jpegDataUrl = im.file.dataUrl; return im; // 변환 실패 시 원본이라도 사용
    });
  })).then(function(){ return model; });
}

function mmToPx(mm){ return mm * 96 / 25.4; }
var REPORT_PAGE_MARGIN_MM = 20;
var REPORT_PAGE_WIDTH_PX = mmToPx(210) - mmToPx(REPORT_PAGE_MARGIN_MM*2);
var REPORT_PAGE_BUDGET_PX = (mmToPx(297) - mmToPx(REPORT_PAGE_MARGIN_MM*2)) * 2; // 2장 분량

function clipText(text, len){
  text = text || '';
  if(text.length<=len) return text;
  return text.slice(0,len).trim()+'…(지면 관계상 이하 생략)';
}

function buildReportHtml(model, trim){
  var introText = clipText(model.intro || '(작성된 서론 내용이 없습니다.)', trim.introLen);
  var bodyText = clipText(model.body || '(작성된 본론/개조식 내용이 없습니다.)', trim.bodyLen);
  var conclusionParts = [];
  if(model.conclusion) conclusionParts.push(model.conclusion);
  if(model.feedbackNote) conclusionParts.push(model.feedbackNote);
  var conclusionText = clipText(conclusionParts.join(' ') || '(작성된 결론 내용이 없습니다.)', trim.conclusionLen);

  var shownImages = model.images.list.slice(0, trim.imageCount);
  var imagesHtml = shownImages.map(function(im, idx){
    return '<div class="report-figure"><img src="'+(im.jpegDataUrl||im.file.dataUrl)+'" style="max-width:'+trim.imageWidthPx+'px;">' +
      '<div class="report-figure-cap">[자료 '+(idx+1)+'] '+escapeHtml(im.title||'제목 없음')+(im.description?' — '+escapeHtml(im.description):'')+'</div></div>';
  }).join('');
  var omittedNote = (model.images.totalCount>shownImages.length)
    ? '<p class="faint" style="font-size:0.75em;">※ 첨부 자료가 많아 대표 자료 '+shownImages.length+'개만 표시했습니다(전체 '+model.images.totalCount+'개).</p>' : '';

  var sourcesHtml = model.tools.length
    ? '<ul class="report-sources">'+model.tools.map(function(t){ return '<li>'+escapeHtml(t.name)+(t.reference?' — '+escapeHtml(t.reference):'')+'</li>'; }).join('')+'</ul>'
    : '<p class="faint">활용한 도구나 자료 출처가 기록되지 않았습니다.</p>';

  var schoolLine = schoolLineParts();
  return '<div class="report-title">'+escapeHtml(model.topic||'(제목 없음)')+'</div>' +
    '<div class="report-meta">'+escapeHtml(model.student.studentId)+' '+escapeHtml(model.student.name)+
      (schoolLine.length? ' · '+escapeHtml(schoolLine.join(' ')) : '') + ' · '+fmtDateTime(nowISO())+'</div>' +
    '<h4>Ⅰ. 서론</h4><p style="white-space:pre-wrap;">'+escapeHtml(introText)+'</p>' +
    '<h4>Ⅱ. 본론</h4><p style="white-space:pre-wrap;">'+escapeHtml(bodyText)+'</p>' +
    imagesHtml + omittedNote +
    '<h4>Ⅲ. 결론</h4><p style="white-space:pre-wrap;">'+escapeHtml(conclusionText)+'</p>' +
    '<h4>&lt;출처&gt;</h4>' + sourcesHtml;
}

function measureReportHeight(html){
  var div = document.createElement('div');
  div.style.position = 'absolute';
  div.style.left = '-99999px';
  div.style.top = '0';
  div.style.width = REPORT_PAGE_WIDTH_PX+'px';
  div.style.fontSize = '10pt';
  div.style.lineHeight = '1.6';
  div.className = 'report-doc';
  div.innerHTML = html;
  document.body.appendChild(div);
  var h = div.scrollHeight;
  document.body.removeChild(div);
  return h;
}

/**
 * A4(글자 10pt, 줄간격 160%) 기준 2장 분량에 맞추기 위해, 이미지 개수/크기와
 * 서론·본론·결론 분량을 단계적으로 줄여가며 다시 측정합니다(최선의 노력이며,
 * 수학적으로 2장을 보장하지는 않습니다 — 그 경우 overflow:true를 반환).
 */
function buildFittedReport(model){
  var trim = { introLen:600, bodyLen:2400, conclusionLen:600, imageCount: model.images.list.length, imageWidthPx:170 };
  var html = buildReportHtml(model, trim);
  var height = measureReportHeight(html);
  var attempts = 0;
  while(height > REPORT_PAGE_BUDGET_PX && attempts < 10){
    attempts++;
    if(trim.imageCount > 2){ trim.imageCount--; }
    else if(trim.imageWidthPx > 110){ trim.imageWidthPx -= 20; }
    else if(trim.bodyLen > 900){ trim.bodyLen -= 300; }
    else if(trim.introLen > 220){ trim.introLen -= 100; }
    else if(trim.conclusionLen > 220){ trim.conclusionLen -= 100; }
    else if(trim.imageCount > 0){ trim.imageCount--; }
    else { break; }
    html = buildReportHtml(model, trim);
    height = measureReportHeight(html);
  }
  return { html: html, overflow: height > REPORT_PAGE_BUDGET_PX };
}

function doOpenReport(){
  var student = STATE.students[VIEW.studentId];
  if(!student) return;
  var targetId = student.studentId;
  VIEW.screen = 'report';
  REPORT_STATE = { studentId: targetId, loading:true, html:null, overflow:false };
  render();
  buildReportModelAsync(student).then(function(model){
    if(VIEW.screen!=='report' || REPORT_STATE.studentId!==targetId) return; // 그 사이 다른 화면으로 이동함
    var fitted = buildFittedReport(model);
    REPORT_STATE.loading = false;
    REPORT_STATE.html = fitted.html;
    REPORT_STATE.overflow = fitted.overflow;
    render();
  }).catch(function(){
    if(VIEW.screen!=='report' || REPORT_STATE.studentId!==targetId) return;
    REPORT_STATE.loading = false;
    REPORT_STATE.html = '<p class="notice warn">보고서를 만드는 중 문제가 발생했습니다. 다시 시도해 주세요.</p>';
    render();
  });
}

/* ============================== 학생 대시보드 ============================== */
function stepperState(stage, student){
  var status = student.stageStatus[stage];
  if(stage==='stage1') return status==='approved' ? 'done' : (status==='locked' ? 'todo' : 'current');
  if(stage==='final'){
    var hasFinalSubmission = student.timeline.some(function(e){ return e.stage==='final' && e.type==='submission'; });
    return hasFinalSubmission ? 'done' : (status==='locked' ? 'todo' : 'current');
  }
  return status==='locked' ? 'todo' : 'current';
}

function renderStageStepper(student){
  var steps = STAGE_ORDER.map(function(stage){
    var info = STAGE_INFO[stage];
    var state = stepperState(stage, student);
    return '<div class="stepper-step '+state+'">' +
      '<div class="stepper-circle">'+(state==='done'? '✓' : info.icon)+'</div>' +
      '<div class="stepper-label">'+escapeHtml(info.shortLabel)+'</div>' +
    '</div>';
  }).join('');
  return '<div class="stepper no-print">'+steps+'</div>';
}

/**
 * 도해력(그래픽 문해력) 평가를 위해, 탐구 과정에는 통계지도 또는 표 중 하나가
 * 반드시 포함되어야 합니다. 조사 항목은 이제 "탐구 진행하기(research)" 단계에서
 * 작성하므로, 그 단계의 (아직 제출 전) 작성 중인 항목이나 이미 제출된 기록 중
 * 하나라도 "통계지도"/"표" 유형으로 표시되어 있으면 충족된 것으로 봅니다.
 */
function hasRequiredGraphicItem(student){
  var s = STATE.students[student.studentId] || student;
  var researchDraftItems = (s.draft && s.draft.research && s.draft.research.items) || [];
  var inDraft = researchDraftItems.some(function(it){ return GRAPHIC_ITEM_TYPES.indexOf(it.itemType)!==-1; });
  if(inDraft) return true;
  return (s.timeline||[]).some(function(e){
    return e.stage==='research' && e.type==='submission' &&
      (e.items||[]).some(function(it){ return GRAPHIC_ITEM_TYPES.indexOf(it.itemType)!==-1; });
  });
}

var OUTLINE_MARKERS = ['Ⅰ.','Ⅱ.','Ⅲ.','1.','2.','가.','나.','1)','2)','가)','나)'];

function insertOutlineMarker(stage, marker){
  var ta = document.querySelector('textarea[data-main-input="'+stage+'"]');
  if(!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var value = ta.value;
  var atLineStart = start===0 || value.charAt(start-1)==='\n';
  var insertText = (atLineStart? '' : '\n') + marker + ' ';
  var newValue = value.slice(0,start) + insertText + value.slice(end);
  ta.value = newValue;
  var newPos = start + insertText.length;
  ta.setSelectionRange(newPos, newPos);
  ta.focus();
  getStageDraft(stage).mainText = newValue;
  saveState();
  markAutosaved(stage);
}
