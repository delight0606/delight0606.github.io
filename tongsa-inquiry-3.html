<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탐구 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8FF;
    --surface:#FFFFFF;
    --surface-alt:#EAF1FF;
    --border:#DCE6F7;
    --ink:#20263A;
    --ink-soft:#5C6784;
    --ink-faint:#98A2BE;
    --accent:#3D8BFF;
    --accent2:#7C6BFF;
    --accent-strong:#2F6FE0;
    --accent-soft:#E4EFFF;
    --accent-soft-border:#BFDBFF;
    --amber:#F59E0B;
    --amber-soft:#FFF3D6;
    --amber-soft-border:#FBE3A4;
    --danger:#F43F5E;
    --danger-soft:#FFE3E8;
    --danger-soft-border:#FFC2CE;
    --locked:#9CA6BC;
    --locked-soft:#EFF2F8;
    --locked-soft-border:#DDE3EE;
    --shadow: 0 2px 8px rgba(61,139,255,.07), 0 10px 26px rgba(32,38,58,.06);
    --radius: 18px;
    --heading: 'Jua', 'Noto Sans KR', sans-serif;
    --sans: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    --mono: 'JetBrains Mono', 'Roboto Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161F;
      --surface:#1B2130;
      --surface-alt:#232B3D;
      --border:#323B52;
      --ink:#EAF0FF;
      --ink-soft:#A7B2CC;
      --ink-faint:#727C99;
      --accent:#5B9DFF;
      --accent2:#9C8CFF;
      --accent-strong:#7DB2FF;
      --accent-soft:#1E2E4D;
      --accent-soft-border:#2E4470;
      --amber:#FFC24D;
      --amber-soft:#3D3113;
      --amber-soft-border:#5C481F;
      --danger:#FF7A90;
      --danger-soft:#3A1620;
      --danger-soft-border:#5C2233;
      --locked:#8791AC;
      --locked-soft:#232A3A;
      --locked-soft-border:#323B52;
      --shadow: 0 2px 8px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161F;
    --surface:#1B2130;
    --surface-alt:#232B3D;
    --border:#323B52;
    --ink:#EAF0FF;
    --ink-soft:#A7B2CC;
    --ink-faint:#727C99;
    --accent:#5B9DFF;
    --accent2:#9C8CFF;
    --accent-strong:#7DB2FF;
    --accent-soft:#1E2E4D;
    --accent-soft-border:#2E4470;
    --amber:#FFC24D;
    --amber-soft:#3D3113;
    --amber-soft-border:#5C481F;
    --danger:#FF7A90;
    --danger-soft:#3A1620;
    --danger-soft-border:#5C2233;
    --locked:#8791AC;
    --locked-soft:#232A3A;
    --locked-soft-border:#323B52;
    --shadow: 0 2px 8px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:960px;
    margin:0 auto;
    padding:20px 18px 80px;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}
  h1,h2,h3,h4{font-family:var(--heading);font-weight:700;margin:0 0 6px;text-wrap:balance;color:var(--ink);}
  p{margin:0 0 10px;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);font-size:13px;}
  button, .btn{
    font-family:var(--sans);
    font-size:14.5px;
    font-weight:700;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:11px 18px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
    touch-action:manipulation;
  }
  button:hover{border-color:var(--accent);}
  button:active{transform:scale(0.97);}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px rgba(61,139,255,.28);}
  button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  button.ghost{background:transparent;}
  button.danger{color:var(--danger);border-color:var(--danger-soft-border);}
  button.danger:hover{border-color:var(--danger);}
  button.small{padding:7px 14px;font-size:12.5px;border-radius:999px;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  input, textarea, select{
    font-family:var(--sans);
    font-size:16px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 11px;
    width:100%;
  }
  @media (min-width:640px){ input, textarea, select{ font-size:14px; } }
  textarea{min-height:88px;resize:vertical;line-height:1.55;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}

  /* header / masthead */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;border-radius:var(--radius);
    padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .masthead .brand{display:flex;flex-direction:column;gap:2px;}
  .masthead .brand .subject{font-family:var(--heading);font-weight:400;font-size:22px;letter-spacing:.01em;}
  .masthead .brand .sub{font-size:12.5px;opacity:.9;}
  .masthead .who{display:flex;align-items:center;gap:8px;font-size:13px;}
  .masthead .who .badge2{background:rgba(255,255,255,.16);border-radius:8px;padding:5px 10px;font-weight:600;}
  .masthead-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .masthead-actions button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);}
  .masthead-actions button:hover{background:rgba(255,255,255,.22);border-color:#fff;}
  @media (max-width:760px){
    .masthead{flex-direction:column;align-items:stretch;}
    .masthead-actions{justify-content:flex-start;}
  }

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .card.tight{padding:14px 16px;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .hgroup{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}

  /* home */
  .home-hero{text-align:center;padding:38px 10px 8px;}
  .home-hero .eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 14px;}
  .home-hero h1{font-family:var(--heading);font-weight:400;font-size:34px;margin-top:12px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0;}
  @media (max-width:600px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 24px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease, transform .1s ease;
  }
  .role-card:hover{border-color:var(--accent);transform:translateY(-3px);}
  .role-card .icon{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:16px;margin-bottom:4px;}
  .role-card:nth-child(2) .icon{background:var(--amber-soft);}
  .role-card .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;}
  .role-card h3{font-family:var(--heading);font-weight:400;font-size:23px;margin-bottom:2px;}
  .role-card p{color:var(--ink-soft);font-size:13.5px;margin:0;}

  /* status chip */
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    padding:4px 10px 4px 8px;border-radius:999px;border:1px solid; white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .chip.st-locked{background:var(--locked-soft);border-color:var(--locked-soft-border);color:var(--locked);}
  .chip.st-locked .dot{background:var(--locked);}
  .chip.st-open{background:var(--surface-alt);border-color:var(--border);color:var(--ink-soft);}
  .chip.st-open .dot{background:var(--ink-faint);}
  .chip.st-submitted{background:var(--amber-soft);border-color:var(--amber-soft-border);color:var(--amber);}
  .chip.st-submitted .dot{background:var(--amber);}
  .chip.st-approved{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent);}
  .chip.st-approved .dot{background:var(--accent);}
  .chip.st-late{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger);}
  .chip.st-late .dot{background:var(--danger);}

  /* stage timeline */
  .stage-block{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .stage-head{
    display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface-alt);
    flex-wrap:wrap;justify-content:space-between;
  }
  .stage-head .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .stage-head .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stage-num{
    font-family:var(--heading);font-weight:900;font-size:15px;color:var(--accent);
    background:var(--accent-soft);border:1px solid var(--accent-soft-border);
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .stage-title{font-family:var(--heading);font-weight:700;font-size:16px;}
  .stage-deadline{font-size:12.5px;color:var(--ink-soft);font-family:var(--mono);}
  .stage-body{padding:16px 18px;background:var(--surface);}
  .stage-body.empty{color:var(--ink-faint);font-size:13.5px;font-style:italic;}

  /* stage stepper (student dashboard progress guide) */
  .stepper{display:flex;align-items:flex-start;gap:0;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px;}
  .stepper-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:92px;position:relative;text-align:center;}
  .stepper-step:not(:last-child)::after{
    content:'';position:absolute;top:19px;left:calc(50% + 24px);right:calc(-50% + 24px);height:3px;
    background:var(--border);z-index:0;
  }
  .stepper-step.done:not(:last-child)::after{background:var(--accent);}
  .stepper-circle{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:700;background:var(--locked-soft);border:2px solid var(--locked-soft-border);
    color:var(--locked);position:relative;z-index:1;
  }
  .stepper-step.current .stepper-circle{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .stepper-step.done .stepper-circle{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stepper-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:6px;line-height:1.3;}
  .stepper-step.current .stepper-label{color:var(--accent);}

  .save-hint{font-size:12px;color:var(--ink-faint);margin:-6px 0 12px;display:flex;align-items:center;gap:5px;}
  .hint-small{font-size:12px;color:var(--ink-faint);margin-top:-3px;margin-bottom:8px;transition:opacity .15s ease;}
  .hint-small.hidden{display:none;}
  .item-type-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-soft-border);}

  .entry{border-left:3px solid var(--border);padding:4px 0 4px 14px;margin-bottom:14px;position:relative;}
  .entry:last-child{margin-bottom:0;}
  .entry.type-feedback{border-left-color:var(--amber);}
  .entry.type-submission{border-left-color:var(--accent);}
  .entry.type-approval{border-left-color:var(--accent);}
  .entry .entry-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-faint);margin-bottom:4px;flex-wrap:wrap;}
  .entry .entry-author{font-weight:700;color:var(--ink-soft);}
  .entry .entry-text{white-space:pre-wrap;font-size:14px;}
  .item-card{
    background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-top:8px;
  }
  .item-card.tool-card{border-left:3px solid var(--amber);}
  .item-card .item-title{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .item-card .item-desc{white-space:pre-wrap;font-size:13.5px;color:var(--ink-soft);}
  .file-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .file-chip{
    display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:5px 9px;font-size:12px;text-decoration:none;color:var(--ink);
  }
  .file-chip img{width:20px;height:20px;object-fit:cover;border-radius:4px;}
  .file-chip .ic{font-size:14px;}

  .form-item{border:1px dashed var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface-alt);}
  .form-item.tool-item{border-color:var(--amber-soft-border);}
  .form-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .form-item-head .num{font-family:var(--mono);font-size:12px;color:var(--ink-faint);}
  .draft-file-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .draft-file-chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:4px 7px;font-size:11.5px;}
  .draft-file-chip button{padding:1px 5px;font-size:11px;border-radius:5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--surface-alt);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .notice{
    border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:12px;border:1px solid;
  }
  .notice.info{background:var(--surface-alt);border-color:var(--border);color:var(--ink-soft);}
  .notice.warn{background:var(--amber-soft);border-color:var(--amber-soft-border);color:var(--amber);}
  .notice.danger{background:var(--danger-soft);border-color:var(--danger-soft-border);color:var(--danger);}
  .notice.ok{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent);}
  .teacher-only-tag{font-size:11px;font-family:var(--mono);letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:10px;font-size:13.5px;
    box-shadow:var(--shadow);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .link-btn{background:none;border:none;color:var(--accent);text-decoration:underline;padding:0;font-size:13px;cursor:pointer;}
  .backlink{margin-bottom:14px;}
  .helpbox{font-size:13px;color:var(--ink-soft);}
  .helpbox li{margin-bottom:6px;}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:2px;}
  .summary-block{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .summary-block .sname{font-family:var(--heading);font-weight:700;font-size:15.5px;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow);border:1px solid var(--border);max-height:85vh;overflow-y:auto;}

  /* reply threads */
  .reply-thread{margin-top:10px;padding-left:16px;border-left:2px dashed var(--border);}
  .reply-entry{margin-bottom:10px;font-size:13px;}
  .reply-entry .reply-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px;}
  .reply-author{font-weight:700;color:var(--ink-soft);font-size:12.5px;}
  .reply-text{white-space:pre-wrap;color:var(--ink);}
  .reply-box{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
  .reply-box textarea{min-height:52px;}
  .feedback-count-badge{font-size:11.5px;color:var(--ink-faint);}

  @media print {
    .no-print{display:none !important;}
    body{background:#fff;color:#000;}
    .card{box-shadow:none;border:1px solid #ccc;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none">
<script>
(function(){
"use strict";

/* ============================== 유틸 ============================== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDateTime(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  var p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function fmtDate(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  var p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate());
}
function toDatetimeLocalValue(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  var p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function fromDatetimeLocalValue(v){
  if(!v) return null;
  var d = new Date(v);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}
function isPast(iso){
  if(!iso) return false;
  return new Date(iso).getTime() < Date.now();
}

/* ============================== 비밀번호 해시 ============================== */
// Passwords are never stored in plain text. This is a lightweight client-side
// tool (no server, no real threat model beyond "classmates shouldn't be able
// to open each other's records"), so a salted SHA-256 hash is enough — it
// keeps a casual look at an exported backup .json from revealing anyone's
// actual password. crypto.subtle needs a secure context (HTTPS, or a local
// file:// page, both of which this app supports); a simple non-cryptographic
// fallback keeps the feature working even where it isn't available.
function randomSalt(){
  var bytes = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  return Array.prototype.map.call(bytes, function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function simpleHashFallback(text){
  var h = 0;
  for(var i=0;i<text.length;i++){ h = (Math.imul(31,h) + text.charCodeAt(i))|0; }
  return 'fb_' + (h>>>0).toString(16);
}
function hashSecret(text){
  if(window.crypto && window.crypto.subtle && window.isSecureContext !== false){
    try{
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      }).catch(function(){ return simpleHashFallback(text); });
    }catch(err){ return Promise.resolve(simpleHashFallback(text)); }
  }
  return Promise.resolve(simpleHashFallback(text));
}
function hashPassword(password, salt){ return hashSecret(salt+':'+password); }

function readFileAsDataURL(file){
  return new Promise(function(resolve,reject){
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(r.error); };
    r.readAsDataURL(file);
  });
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ============================== IndexedDB ============================== */
var DB_NAME = 'inquiry_tracker_db_v1';
var STORE = 'kv';
var _db = null;
function openDB(){
  return new Promise(function(resolve,reject){
    if(_db){ resolve(_db); return; }
    if(!window.indexedDB){ reject(new Error('no-indexeddb')); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e){
      e.target.result.createObjectStore(STORE);
    };
    req.onsuccess = function(e){ _db = e.target.result; resolve(_db); };
    req.onerror = function(e){ reject(e.target.error); };
  });
}
function dbGet(key){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(STORE,'readonly');
      var r = tx.objectStore(STORE).get(key);
      r.onsuccess = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}
function dbSet(key,val){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(STORE,'readwrite');
      var r = tx.objectStore(STORE).put(val,key);
      r.onsuccess = function(){ resolve(); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}

/**
 * Upgrades state saved by the earlier 4-stage version of this file
 * (stage1/stage2/stage3/final) into the current 3-stage model
 * (stage1/research/final), where stage2+stage3 are merged into one
 * flexible "research" phase. Safe to call on already-current state (no-op).
 */
function migrateState(state){
  var changed = false;
  if(!state.meta.teachers){ state.meta.teachers = []; changed = true; }
  if(state.meta.region===undefined){ state.meta.region = ''; changed = true; }
  if(state.meta.schoolName===undefined){ state.meta.schoolName = ''; changed = true; }
  Object.keys(state.students||{}).forEach(function(id){
    var s0 = state.students[id];
    if(s0.passwordHash===undefined){ s0.passwordHash = null; changed = true; }
    if(s0.passwordSalt===undefined){ s0.passwordSalt = null; changed = true; }
    if(!s0.draft){ s0.draft = {}; changed = true; }
  });
  if(state.deadlines && (state.deadlines.stage2!==undefined || state.deadlines.stage3!==undefined)){
    var mergedDeadline = state.deadlines.stage2 || state.deadlines.stage3 || null;
    state.deadlines = { stage1: state.deadlines.stage1||null, research: mergedDeadline, final: state.deadlines.final||null };
    changed = true;
  }
  if(!state.deadlines) { state.deadlines = {stage1:null, research:null, final:null}; changed = true; }
  Object.keys(state.students||{}).forEach(function(id){
    var s = state.students[id];
    if(s.stageStatus && (s.stageStatus.stage2!==undefined || s.stageStatus.stage3!==undefined)){
      var rank2 = stageRank(s.stageStatus.stage2||'locked'), rank3 = stageRank(s.stageStatus.stage3||'locked');
      var best = Math.max(rank2, rank3);
      var mergedStatus = ['locked','open','submitted','approved'][best] || 'locked';
      if(mergedStatus==='approved') mergedStatus = 'submitted'; // research no longer has an 'approved' gate
      s.stageStatus = { stage1: s.stageStatus.stage1||'open', research: mergedStatus, final: s.stageStatus.final||'locked' };
      changed = true;
    }
    if(s.stageStatus && s.stageStatus.stage1==='approved'){
      // under the new model, approving stage1 opens both research and final together
      if(s.stageStatus.research==='locked'){ s.stageStatus.research='open'; changed = true; }
      if(s.stageStatus.final==='locked'){ s.stageStatus.final='open'; changed = true; }
    }
    (s.timeline||[]).forEach(function(e){
      if(e.stage==='stage2' || e.stage==='stage3'){ e.stage='research'; changed = true; }
      if(e.tools===undefined){ e.tools = []; changed = true; }
      if(e.threadRoot===undefined){ e.threadRoot = null; changed = true; }
    });
  });
  return changed;
}

/**
 * Where a student's in-progress (not-yet-submitted) writing lives. Backed by
 * STATE.students[id].draft so it survives page reloads, browser restarts and
 * even months between sessions — this is what lets a student close the page
 * mid-paragraph and pick up writing again later exactly where they left off.
 * Falls back to the old ephemeral DRAFTS.stageForm bucket when no student is
 * in session (shouldn't normally happen, since only the student dashboard
 * renders stage forms).
 */
function stageDraftStore(){
  if(VIEW.role==='student' && VIEW.studentId && STATE.students[VIEW.studentId]){
    var s = STATE.students[VIEW.studentId];
    if(!s.draft) s.draft = {};
    return s.draft;
  }
  return DRAFTS.stageForm;
}
function getStageDraft(stage){
  var store = stageDraftStore();
  if(!store[stage]) store[stage] = freshStageDraft();
  return store[stage];
}
function resetStageDraft(stage){ stageDraftStore()[stage] = freshStageDraft(); }

function entryInnerHtml(entry){
  var typeLabel = {submission:'제출', feedback:'피드백', approval:'승인', reopen:'재검토 요청'}[entry.type] || entry.type;
  var authorLabel = entry.author==='teacher' ? (entry.authorName||'교사') : '학생';
  var itemsHtml = '';
  if(entry.items && entry.items.length){
    itemsHtml = entry.items.map(function(it, idx){
      var files = (it.files||[]).map(fileChip).join('');
      if(!it.title && !it.description && !(it.files||[]).length && !it.itemType) return '';
      var typeBadge = (it.itemType && GRAPHIC_ITEM_TYPES.indexOf(it.itemType)!==-1) ?
        '<span class="item-type-badge">'+(it.itemType==='통계지도'?'📍':'📋')+' '+escapeHtml(it.itemType)+'</span>' : '';
      return '<div class="item-card">' +
        '<div class="item-title">조사 항목 '+(idx+1)+(it.title? ' · '+escapeHtml(it.title):'')+typeBadge+'</div>' +
        (it.description? '<div class="item-desc">'+escapeHtml(it.description)+'</div>' : '') +
        (files? '<div class="file-list">'+files+'</div>' : '') +
      '</div>';
    }).join('');
  }
  var toolsHtml = '';
  if(entry.tools && entry.tools.length){
    toolsHtml = entry.tools.map(function(t, idx){
      if(!t.name && !t.reference) return '';
      return '<div class="item-card tool-card">' +
        '<div class="item-title">🔧 활용 도구 '+(idx+1)+(t.name? ' · '+escapeHtml(t.name):'')+'</div>' +
        (t.reference? '<div class="item-desc">'+escapeHtml(t.reference)+'</div>' : '') +
      '</div>';
    }).join('');
  }
  return '<div class="entry-meta"><span class="entry-author">'+authorLabel+(entry.authorName && entry.author!=='teacher'? ' · '+escapeHtml(entry.authorName):'')+'</span>' +
      '<span>· '+typeLabel+'</span>' +
      '<span class="mono">· '+fmtDateTime(entry.ts)+'</span>' +
      (entry.late? '<span class="chip st-late" style="margin-left:4px;"><span class="dot"></span>기한 초과</span>' : '') +
    '</div>' +
    (entry.mainText? '<div class="entry-text">'+escapeHtml(entry.mainText)+'</div>' : '') +
    itemsHtml + toolsHtml;
}

/**
 * Renders one stage's entries as a chronological list, nesting any
 * 'comment' replies underneath the 'feedback' entry they respond to and
 * offering an inline reply box there. Used identically in the teacher and
 * student views so every teacher (up to the recommended 3) and the student
 * see the exact same feedback/comment thread.
 */
function renderStageEntries(entries, stage){
  var topLevel = entries.filter(function(e){ return !e.threadRoot; });
  return topLevel.map(function(entry){
    var inner = entryInnerHtml(entry);
    if(entry.type==='feedback'){
      var replies = entries.filter(function(e){ return e.threadRoot===entry.id; })
        .sort(function(a,b){ return new Date(a.ts)-new Date(b.ts); });
      var draftVal = DRAFTS.reply[entry.id] || '';
      inner += '<div class="reply-thread">' +
        replies.map(replyEntryHtml).join('') +
        '<div class="reply-box">' +
          '<textarea data-reply-input="'+entry.id+'" placeholder="이 피드백에 대한 생각이나 답변을 남겨보세요">'+escapeHtml(draftVal)+'</textarea>' +
          '<div><button type="button" class="small" data-action="send-reply" data-root="'+entry.id+'" data-stage="'+stage+'">답글 남기기</button></div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="entry type-'+entry.type+'">' + inner + '</div>';
  }).join('');
}

/* ============================== 교사 - 학생 상세 ============================== */
function stageActionsForTeacher(student, stage){
  // Only stage1(주제 선정) gates the next steps, so only it has an approve/reopen action.
  if(stage !== 'stage1') return '';
  var status = student.stageStatus[stage];
  var actions = '';
  if(status==='submitted'){
    actions += '<button class="small primary" data-action="approve-stage" data-stage="'+stage+'">이 단계 승인</button> ';
  } else if(status==='approved'){
    actions += '<button class="small ghost" data-action="reopen-stage" data-stage="'+stage+'">재검토 요청(다시 열기)</button> ';
  }
  return actions;
}

}

/* ============================== 교사 - 발표/세특 요약 (교사만 접근 가능) ============================== */
function generateSummaryText(student){
  function lastMain(stage){
    var subs = student.timeline.filter(function(e){ return e.stage===stage && e.type==='submission'; });
    return subs.length? subs[subs.length-1].mainText : '';
  }
  function feedbackCount(stage){
    return student.timeline.filter(function(e){ return e.stage===stage && e.type==='feedback' && !e.threadRoot; }).length;
  }
  function toolsUsed(){
    var names = [];
    student.timeline.forEach(function(e){
      (e.tools||[]).forEach(function(t){
        if(t.name && names.indexOf(t.name)===-1) names.push(t.name);
      });
    });
    return names;
  }
  var topic = lastMain('stage1');
  var research = lastMain('research');
  var final = lastMain('final');
  var tools = toolsUsed();
  var parts = [];
  if(topic) parts.push('‘'+topic+'’을(를) 탐구 주제로 선정하고'+(feedbackCount('stage1')? ' 교사 피드백을 반영하여 주제를 구체화함.' : '함.'));
  if(research) parts.push('서론-본론-결론의 방향을 설정하고 자료를 조사·분석하며 탐구 내용을 구체화함('+research.slice(0,70)+(research.length>70?'…':'')+').');
  if(tools.length) parts.push('탐구 과정에서 '+tools.join(', ')+' 등을 활용함.');
  if(final) parts.push('최종적으로 '+(student.presentationEligible? '기한 내 ':'')+'탐구 결과물을 완성함('+final.slice(0,80)+(final.length>80?'…':'')+').');
  parts.push(student.presentationEligible? '2학기 기말고사 이후 학급 내 탐구 발표를 진행함.' : '최종 결과물 제출이 확인되지 않아 발표 대상에서 제외됨.');
  if(!topic && !research && !final) return escapeHtml(student.name)+' 학생은 아직 탐구 활동을 시작하지 않음.';
  return escapeHtml(student.name)+' 학생은 '+parts.join(' ');
}

/* ============================== 학생 대시보드 ============================== */
function stepperState(stage, student){
  var status = student.stageStatus[stage];
  if(stage==='stage1') return status==='approved' ? 'done' : (status==='locked' ? 'todo' : 'current');
  if(stage==='final'){
    var hasFinalSubmission = student.timeline.some(function(e){ return e.stage==='final' && e.type==='submission'; });
    return hasFinalSubmission ? 'done' : (status==='locked' ? 'todo' : 'current');
  }
  return status==='locked' ? 'todo' : 'current';
}

function renderStageStepper(student){
  var steps = STAGE_ORDER.map(function(stage){
    var info = STAGE_INFO[stage];
    var state = stepperState(stage, student);
    return '<div class="stepper-step '+state+'">' +
      '<div class="stepper-circle">'+(state==='done'? '✓' : info.icon)+'</div>' +
      '<div class="stepper-label">'+escapeHtml(info.shortLabel)+'</div>' +
    '</div>';
  }).join('');
  return '<div class="stepper no-print">'+steps+'</div>';
}

/**
 * 도해력(그래픽 문해력) 평가를 위해, 최종 결과물에는 통계지도 또는 표 중 하나가
 * 반드시 포함되어야 합니다. 이미 제출된 최종 기록이나, 현재 작성 중인 조사
 * 항목 중 하나라도 "통계지도"/"표" 유형으로 표시되어 있으면 충족된 것으로 봅니다.
 */
function hasRequiredGraphicItem(student, draftItems){
  var inDraft = (draftItems||[]).some(function(it){ return GRAPHIC_ITEM_TYPES.indexOf(it.itemType)!==-1; });
  if(inDraft) return true;
  return student.timeline.some(function(e){
    return e.stage==='final' && e.type==='submission' &&
      (e.items||[]).some(function(it){ return GRAPHIC_ITEM_TYPES.indexOf(it.itemType)!==-1; });
  });
}

function screenStudentDashboard(){
  var student = STATE.students[VIEW.studentId];
  if(!student){ VIEW.screen='home'; return screenHome(); }
  var stagesHtml = STAGE_ORDER.map(function(stage){
    var info = STAGE_INFO[stage];
    var status = student.stageStatus[stage];
    var entries = student.timeline.filter(function(e){ return e.stage===stage; });
    var deadline = STATE.deadlines[stage];
    var editable = (status==='open' || status==='submitted');
    var body = '';
    if(entries.length) body += renderStageEntries(entries, stage);
    else body += '<div class="faint" style="font-style:italic;margin-bottom:10px;">'+escapeHtml(info.hint)+'</div>';

    if(status==='locked'){
      body += '<div class="notice info">🔒 탐구 주제(1차)가 승인되면 이 단계를 진행할 수 있어요.</div>';
    } else if(editable){
      body += renderStageForm(stage, deadline, student);
    } else if(status==='approved'){
      body += '<div class="notice ok">👍 이 단계는 승인되었어요. 다음 단계를 진행해 보세요.</div>';
    }
    return '<div class="stage-block">' +
      '<div class="stage-head">' +
        '<div class="left">' +
          (info.num? '<span class="stage-num">'+info.num+'</span>' : '<span class="stage-num">★</span>') +
          '<div><div class="stage-title">'+escapeHtml(info.label)+'</div>' +
            '<div class="stage-deadline">기한: '+fmtDateTime(deadline)+(isPast(deadline)&&status!=='approved'?' · <span style="color:var(--danger)">경과</span>':'')+'</div></div>' +
        '</div>' +
        '<div class="right">' + (stage==='research'? feedbackCountBadge(entries)+' ' : '') + statusChip(status) + '</div>' +
      '</div>' +
      '<div class="stage-body">'+body+'</div>' +
    '</div>';
  }).join('');

  return masthead(student.studentId+' '+student.name) +
  '<div class="backlink no-print"><button class="ghost small" data-action="go-home">← 로그아웃</button></div>' +
  renderStageStepper(student) +
  (student.presentationEligible ? '<div class="notice ok">🎉 최종 결과물을 기한 내에 제출했습니다. 2학기 기말고사 이후 학급 발표 대상입니다.</div>' : '') +

}

function renderStageForm(stage, deadline, student){
  var draft = getStageDraft(stage);

  var itemsHtml = draft.items.map(function(item, idx){
    var files = item.files.map(function(f,fi){
      return '<span class="draft-file-chip">'+escapeHtml(f.name)+' <button type="button" class="ghost" data-action="remove-draft-file" data-stage="'+stage+'" data-item="'+idx+'" data-file="'+fi+'">✕</button></span>';
    }).join('');
    return '<div class="form-item">' +
      '<div class="form-item-head"><span class="num">조사 항목 '+(idx+1)+'</span>' +
        (draft.items.length>1 ? '<button type="button" class="small ghost" data-action="remove-item" data-stage="'+stage+'" data-item="'+idx+'">항목 삭제</button>' : '') +
      '</div>' +
      '<div class="field"><label>제목</label><input data-item-field="title" data-stage="'+stage+'" data-item="'+idx+'" value="'+escapeHtml(item.title)+'" placeholder="예: 지형도 분석"></div>' +
      (stage==='final' ? '<div class="field"><label>자료 유형</label><select data-item-field="itemType" data-stage="'+stage+'" data-item="'+idx+'">'+itemTypeOptions(item.itemType)+'</select></div>' : '') +
      '<div class="field"><label>자료 업로드</label><input type="file" multiple data-item-file="'+stage+'|'+idx+'"></div>' +
      (files? '<div class="draft-file-list">'+files+'</div>' : '') +
      '<div class="field" style="margin-top:8px;"><label>설명</label><textarea data-item-field="description" data-stage="'+stage+'" data-item="'+idx+'" placeholder="찾은 자료에 대한 설명을 적어주세요.">'+escapeHtml(item.description)+'</textarea></div>' +
    '</div>';
  }).join('');

  var graphicOk = stage==='final' ? hasRequiredGraphicItem(student, draft.items) : true;

  return '<form data-form="stage-submit" data-stage="'+stage+'" style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px;">' +
    (isPast(deadline)? '<div class="notice warn">⏰ 제출 기한이 지났어요. 제출은 가능하지만 "기한 초과"로 표시됩니다'+(stage==='final'?' (발표 대상에서 제외될 수 있어요).':'.') +'</div>' : '') +
    (stage==='final' ? '<div class="notice info">💡 <b>통계지도나 표는 이렇게 만들어보세요.</b> 클로드, 챗GPT, 제미나이 같은 생성형 AI에게 정리한 자료를 주고 "이 내용을 표로 정리해줘" 또는 "이 데이터로 지역별 통계지도를 만들어줘"라고 요청해 보세요. 만들어진 화면을 캡처하거나 이미지로 저장한 뒤, 아래 조사 항목의 "자료 업로드"에 첨부하고 자료 유형을 선택하면 돼요.</div>' : '') +
    (stage==='final' ? '<div class="notice '+(graphicOk?'ok':'warn')+'" style="margin-bottom:14px;">'+(graphicOk?'✅ 통계지도 또는 표가 포함되어 있어요. 아주 잘하고 있어요!':'⚠️ 최종 결과물에는 통계지도나 표 중 하나를 꼭 포함해야 해요. 아래 조사 항목에서 자료 유형을 "통계지도" 또는 "표"로 선택해 주세요.')+'</div>' : '') +
    '<div class="field"><label>'+mainLabel+'</label><textarea data-main-input="'+stage+'" placeholder="내용을 입력하세요">'+escapeHtml(draft.mainText)+'</textarea></div>' +
    '<p class="save-hint" id="save-note-'+stage+'">✍️ 작성한 내용은 자동으로 저장돼요. 다음에 다시 들어와도 이어서 쓸 수 있어요.</p>' +

/* ============================== 이벤트 바인딩 ============================== */
function bindGlobalHandlers(app){
  app.onclick = function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');
    handleAction(action, t, e);
  };
  app.oninput = function(e){
    var el = e.target;
    if(el.matches('select[data-item-field="itemType"]')){
      // a dropdown choice (not free typing), so a full re-render is safe here —
      // it lets the "통계지도/표 포함 여부" notice update immediately.
      var stageSel = el.getAttribute('data-stage');
      var idxSel = parseInt(el.getAttribute('data-item'),10);
      getStageDraft(stageSel).items[idxSel].itemType = el.value;
      saveState();
      render();
    } else if(el.matches('[data-main-input]')){
      var stage = el.getAttribute('data-main-input');
      getStageDraft(stage).mainText = el.value;
      saveState();
      markAutosaved(stage);
    } else if(el.matches('[data-item-field]')){
      var stage2 = el.getAttribute('data-stage');
      var idx = parseInt(el.getAttribute('data-item'),10);
      var field = el.getAttribute('data-item-field');
      getStageDraft(stage2).items[idx][field] = el.value;
      saveState();
      markAutosaved(stage2);
    } else if(el.matches('[data-tool-field]')){
      var stageT = el.getAttribute('data-stage');
      var idxT = parseInt(el.getAttribute('data-tool'),10);
      var fieldT = el.getAttribute('data-tool-field');
      getStageDraft(stageT).tools[idxT][fieldT] = el.value;
      saveState();
      markAutosaved(stageT);
    } else if(el.matches('[data-bind="roster"]')){
      DRAFTS.roster = el.value;
    } else if(el.matches('[data-feedback-input]')){
      DRAFTS.feedback[el.getAttribute('data-feedback-input')] = el.value;
    } else if(el.matches('[data-reply-input]')){
      DRAFTS.reply[el.getAttribute('data-reply-input')] = el.value;
    } else if(el.matches('[data-summary-input]')){
      DRAFTS.summaryOverrides[el.getAttribute('data-summary-input')] = el.value;
    } else if(el.matches('input[name="studentId"]')){
      if(VIEW.screen==='studentLogin') DRAFTS.loginId = el.value;
      if(VIEW.screen==='teacherDashboard') DRAFTS.newStudentId = el.value;
    } else if(el.matches('input[name="name"]')){
      if(VIEW.screen==='studentLogin') DRAFTS.loginName = el.value;
      if(VIEW.screen==='teacherDashboard') DRAFTS.newStudentName = el.value;
    } else if(el.matches('input[name="password"]') && VIEW.screen==='studentLogin'){
      var pwHint = document.getElementById('pwHint');
      if(pwHint) pwHint.classList.toggle('hidden', el.value.length>0);
    } else if(el.matches('input[name="passcode"]') && VIEW.screen==='teacherAuth'){
      DRAFTS.passcodeAttempt = el.value;
    } else if(el.matches('input[name="teacherName"]') && VIEW.screen==='teacherAuth'){
      DRAFTS.teacherNameAttempt = el.value;
    } else if(el.matches('[data-deadline-stage]')){
      DRAFTS.deadlineInputs[el.getAttribute('data-deadline-stage')] = el.value;
    }
  };
  app.onchange = function(e){
    var el = e.target;
    if(el.matches('[data-item-file]')){
      var parts = el.getAttribute('data-item-file').split('|');
      var stage = parts[0], idx = parseInt(parts[1],10);
      handleItemFiles(el, stage, idx);
    }
  };
  app.onsubmit = function(e){
    var form = e.target.closest('form');
    if(!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    handleForm(kind, form, e);
  };
}

function handleItemFiles(inputEl, stage, idx){
  var files = Array.prototype.slice.call(inputEl.files || []);
  if(!files.length) return;
  var oversized = files.filter(function(f){ return f.size > MAX_FILE_BYTES; });
  var okFiles = files.filter(function(f){ return f.size <= MAX_FILE_BYTES; });
  if(oversized.length){
    toast('4MB를 초과하는 파일은 제외되었습니다: '+oversized.map(function(f){return f.name;}).join(', '));
  }
  Promise.all(okFiles.map(function(f){
    return readFileAsDataURL(f).then(function(dataUrl){
      return {name:f.name, mime:f.type, size:f.size, dataUrl:dataUrl};
    });
  })).then(function(results){
    var draft = getStageDraft(stage);
    draft.items[idx].files = draft.items[idx].files.concat(results);
    inputEl.value = '';
    saveState(true).then(render);
  }).catch(function(){ toast('파일을 읽는 중 오류가 발생했습니다.'); });
}

function handleAction(action, el){
  switch(action){
    case 'go-home':
      VIEW = { screen:'home', role:null, studentId:null, teacherAuthed:false, teacherName:null };
      render(); break;
    case 'open-help':
      showHelp(true); break;
    case 'close-help':
      showHelp(false); break;
    case 'enter-student':
      VIEW.screen='studentLogin'; render(); break;
    case 'enter-teacher':
      VIEW.screen = STATE.meta.teacherPasscode ? 'teacherAuth' : 'teacherSetup';
      render(); break;
    case 'reset-passcode-hint':
      toast('안전을 위해 비밀번호는 저장 파일(json)에 남아있습니다. 관리자에게 백업 파일을 확인해 달라고 요청하세요.'); break;
    case 'back-to-dashboard':
      VIEW.screen='teacherDashboard'; render(); break;
    case 'open-student':
      VIEW.studentId = el.getAttribute('data-id'); VIEW.screen='teacherStudentDetail'; render(); break;
    case 'edit-subject':
      VIEW.screen='teacherSetup'; render(); break;
    case 'show-summary':
      DRAFTS.summaryOverrides = {}; VIEW.screen='teacherSummary'; render(); break;
    case 'add-item': {
      var stage = el.getAttribute('data-stage');
      getStageDraft(stage).items.push({title:'',description:'',files:[],itemType:''});
      saveState(); render(); break;
    }
    case 'remove-item': {
      var stage2 = el.getAttribute('data-stage'), idx = parseInt(el.getAttribute('data-item'),10);
      var draft = getStageDraft(stage2);
      draft.items.splice(idx,1);
      if(!draft.items.length) draft.items.push({title:'',description:'',files:[],itemType:''});
      saveState(); render(); break;
    }
    case 'remove-draft-file': {
      var stage3 = el.getAttribute('data-stage'), idx2 = parseInt(el.getAttribute('data-item'),10), fi = parseInt(el.getAttribute('data-file'),10);
      getStageDraft(stage3).items[idx2].files.splice(fi,1);
      saveState(); render(); break;
    }
    case 'add-tool': {
      var stageT = el.getAttribute('data-stage');
      getStageDraft(stageT).tools.push({name:'',reference:''});
      saveState(); render(); break;
    }
    case 'remove-tool': {
      var stageT2 = el.getAttribute('data-stage'), tIdx = parseInt(el.getAttribute('data-tool'),10);
      var draftT = getStageDraft(stageT2);
      draftT.tools.splice(tIdx,1);
      if(!draftT.tools.length) draftT.tools.push({name:'',reference:''});
      saveState(); render(); break;
    }
    case 'reset-student-password': doResetStudentPassword(el.getAttribute('data-id')); break;
    case 'approve-stage': doApproveStage(el.getAttribute('data-stage')); break;
    case 'reopen-stage': doReopenStage(el.getAttribute('data-stage')); break;
    case 'send-feedback': doSendFeedback(el.getAttribute('data-stage')); break;
    case 'send-reply': doAddReply(el.getAttribute('data-stage'), el.getAttribute('data-root')); break;
    case 'bulk-add-students': doBulkAddStudents(); break;
    case 'export-state': doExportState(); break;
    case 'download-file': doDownloadFileChip(el); break;
    case 'trigger-import': document.getElementById('importFileInput').click(); break;
    case 'regen-summary': delete DRAFTS.summaryOverrides[el.getAttribute('data-id')]; render(); break;
    case 'copy-summary': doCopySummary(el.getAttribute('data-id')); break;
    case 'export-summary': doExportSummary(); break;
    case 'print-summary': window.print(); break;
    default: break;
  }
}

function showHelp(open){
  var existing = document.querySelector('.modal-backdrop');
  if(open && !existing){
    document.getElementById('app').insertAdjacentHTML('beforeend', helpModal());
  } else if(!open && existing){
    existing.remove();
  }
}

function handleForm(kind, form){
  var fd = new FormData(form);
  if(kind==='student-login'){
    var id = (fd.get('studentId')||'').toString().trim();
    var name = (fd.get('name')||'').toString().trim();
    var password = (fd.get('password')||'').toString();
    if(!id || !name || !password){ toast('학번, 이름, 비밀번호를 모두 입력하세요.'); return; }
    var existingStudent = STATE.students[id];
    if(existingStudent && existingStudent.passwordHash){
      // returning student: verify their password
      hashPassword(password, existingStudent.passwordSalt).then(function(hash){
        if(hash !== existingStudent.passwordHash){
          toast('비밀번호가 일치하지 않습니다. 비밀번호를 잊었다면 담당 선생님께 초기화를 요청하세요.');
          return;
        }
        if(existingStudent.name !== name){
          toast('주의: 등록된 이름("'+existingStudent.name+'")과 다릅니다. 계속 진행합니다.');
        }
        enterStudentDashboard(id);
      });
    } else {
      // first login for this studentId: this password becomes their password
      // (also covers students the teacher pre-added via the roster, who have
      // no password set yet, and students created under the earlier version
      // of this file before passwords existed). Only a brand-new password is
      // checked against the format rule — an already-set password keeps
      // working even if it predates this rule.
      if(!PASSWORD_REGEX.test(password)){
        toast('비밀번호는 숫자 또는 영문으로 6~10자 이내로 만들어 주세요. 예: study25');
        return;
      }
      var salt = randomSalt();
      hashPassword(password, salt).then(function(hash){
        if(!existingStudent){
          STATE.students[id] = newStudent(id, name);
        } else if(existingStudent.name !== name){
          toast('주의: 등록된 이름("'+existingStudent.name+'")과 다릅니다. 계속 진행합니다.');
        }
        STATE.students[id].passwordHash = hash;
        STATE.students[id].passwordSalt = salt;
        enterStudentDashboard(id, true);
      });
    }
  } else if(kind==='teacher-auth'){
    var pass = (fd.get('passcode')||'').toString();
    var tname = (fd.get('teacherName')||'').toString().trim();
    if(!tname){ toast('교사 이름을 입력하세요.'); return; }
    if(pass !== STATE.meta.teacherPasscode){ toast('비밀번호가 올바르지 않습니다.'); return; }
    if(!STATE.meta.teachers) STATE.meta.teachers = [];
    if(STATE.meta.teachers.indexOf(tname)===-1){
      if(STATE.meta.teachers.length >= MAX_TEACHERS_HINT){
        var proceed = window.confirm('이미 '+MAX_TEACHERS_HINT+'명의 교사('+STATE.meta.teachers.join(', ')+')가 이 학급에 등록되어 있습니다. 그래도 "'+tname+'"(으)로 계속하시겠습니까?');
        if(!proceed) return;
      }
      STATE.meta.teachers.push(tname);
    }
    VIEW.teacherAuthed = true; VIEW.role='teacher'; VIEW.teacherName = tname; VIEW.screen='teacherDashboard';
    DRAFTS.passcodeAttempt=''; DRAFTS.teacherNameAttempt='';
    saveState(true).then(render);
  } else if(kind==='teacher-setup'){
    var region = (fd.get('region')||'').toString().trim();
    var schoolName = (fd.get('schoolName')||'').toString().trim();
    var subjectName = (fd.get('subjectName')||'').toString().trim() || '개별 탐구 활동';
    var className = (fd.get('className')||'').toString().trim();
    var passcode = (fd.get('passcode')||'').toString();
    var isFirstTime = !STATE.meta.teacherPasscode;
    if(isFirstTime){
      var setupName = (fd.get('teacherName')||'').toString().trim();
      if(!setupName){ toast('담당 교사 이름을 입력하세요.'); return; }
      if(!STATE.meta.teachers) STATE.meta.teachers = [];
      if(STATE.meta.teachers.indexOf(setupName)===-1) STATE.meta.teachers.push(setupName);
      VIEW.teacherName = setupName;
    }
    STATE.meta.region = region;
    STATE.meta.schoolName = schoolName;
    STATE.meta.subjectName = subjectName;
    STATE.meta.className = className;
    if(passcode) STATE.meta.teacherPasscode = passcode;
    else if(isFirstTime){ toast('비밀번호를 설정하세요.'); return; }
    VIEW.teacherAuthed = true; VIEW.role='teacher'; VIEW.screen='teacherDashboard';
    saveState(true).then(function(){ render(); toast('저장되었습니다.'); });
  } else if(kind==='deadlines'){
    STAGE_ORDER.forEach(function(st){
      var v = form.querySelector('[data-deadline-stage="'+st+'"]').value;
      STATE.deadlines[st] = fromDatetimeLocalValue(v);
    });
    DRAFTS.deadlineInputs = {};
    saveState(true).then(function(){ render(); toast('기한이 저장되었습니다.'); });
  } else if(kind==='add-student'){
    var sid = (fd.get('studentId')||'').toString().trim();
    var sname = (fd.get('name')||'').toString().trim();
    if(!sid || !sname){ toast('학번과 이름을 입력하세요.'); return; }
    if(STATE.students[sid]){ toast('이미 등록된 학번입니다.'); return; }
    STATE.students[sid] = newStudent(sid, sname);
    DRAFTS.newStudentId=''; DRAFTS.newStudentName='';
    saveState(true).then(function(){ render(); toast('학생이 추가되었습니다.'); });
  } else if(kind==='stage-submit'){
    doSubmitStage(form.getAttribute('data-stage'));
  }
}

function resetAllDrafts(){
  DRAFTS.stageForm = {}; DRAFTS.feedback = {}; DRAFTS.reply = {};
}

function enterStudentDashboard(id, justSetPassword){
  VIEW.role='student'; VIEW.studentId=id; VIEW.screen='studentDashboard';
  resetAllDrafts();
  saveState(true).then(function(){
    render();
    if(justSetPassword) toast('비밀번호가 설정되었습니다. 다음부터는 이 비밀번호로 입장하세요.');
  });
}

function doSubmitStage(stage){
  var student = STATE.students[VIEW.studentId];
  if(!student) return;
  var draft = getStageDraft(stage);
  var items = draft.items.filter(function(it){ return it.title || it.description || it.files.length || it.itemType; });
  var tools = (draft.tools||[]).filter(function(t){ return t.name || t.reference; });
  if(!draft.mainText.trim() && !items.length && !tools.length){
    toast('내용을 입력하거나 조사 항목/활용 도구를 추가하세요.');
    return;
  }
  if(stage==='final' && !hasRequiredGraphicItem(student, items)){
    toast('최종 결과물에는 통계지도나 표 중 하나를 꼭 포함해야 해요. 조사 항목에서 자료 유형을 선택해 주세요.');
    return;
  }
  var deadline = STATE.deadlines[stage];
  var late = stage==='final' ? isPast(deadline) : false;
  var entry = {
    id: uid(), stage: stage, type:'submission', author:'student', authorName: student.name,
    ts: nowISO(), mainText: draft.mainText.trim(), items: items, tools: tools, late: late, threadRoot: null
  };
  student.timeline.push(entry);
  if(student.stageStatus[stage] !== 'approved'){
    student.stageStatus[stage] = 'submitted';
  }
  if(stage==='final'){
    student.presentationEligible = !late;
  }
  resetStageDraft(stage);
  saveState(true).then(function(){ render(); toast('제출되었습니다.'); });
}

function doSendFeedback(stage){
  var student = STATE.students[VIEW.studentId];
  if(!student) return;
  var key = stage+'|'+student.studentId;
  var text = (DRAFTS.feedback[key]||'').trim();
  if(!text){ toast('피드백 내용을 입력하세요.'); return; }
  student.timeline.push({
    id: uid(), stage: stage, type:'feedback', author:'teacher', authorName: currentTeacherName(),
    ts: nowISO(), mainText: text, items: [], tools: [], threadRoot: null
  });
  DRAFTS.feedback[key] = '';
  saveState(true).then(function(){ render(); toast('피드백을 남겼습니다.'); });
}

function doAddReply(stage, rootId){
  var student = STATE.students[VIEW.studentId];
  if(!student) return;
  var text = (DRAFTS.reply[rootId]||'').trim();
  if(!text){ toast('답글 내용을 입력하세요.'); return; }
  var isTeacher = VIEW.role==='teacher';
  student.timeline.push({
    id: uid(), stage: stage, type:'comment',
    author: isTeacher ? 'teacher' : 'student',
    authorName: isTeacher ? currentTeacherName() : student.name,
    ts: nowISO(), mainText: text, items: [], tools: [], threadRoot: rootId
  });
  DRAFTS.reply[rootId] = '';
  saveState(true).then(function(){ render(); toast('답글을 남겼습니다.'); });
}

function doApproveStage(stage){
  var student = STATE.students[VIEW.studentId];
  if(!student) return;
  student.stageStatus[stage] = 'approved';
  var unlockedMsg = '';
  if(stage==='stage1'){
    var opened = [];
    if(student.stageStatus.research==='locked'){ student.stageStatus.research='open'; opened.push('탐구 진행'); }
    if(student.stageStatus.final==='locked'){ student.stageStatus.final='open'; opened.push('최종 결과물'); }
    if(opened.length) unlockedMsg = ' '+opened.join('과 ')+' 단계를 진행할 수 있습니다.';
  }
  student.timeline.push({
    id: uid(), stage: stage, type:'approval', author:'teacher', authorName: currentTeacherName(),
    ts: nowISO(), mainText: STAGE_INFO[stage].label+' 단계를 승인했습니다.'+unlockedMsg, items:[], tools:[], threadRoot: null
  });
  saveState(true).then(function(){ render(); toast('승인되었습니다.'); });
}

function doReopenStage(stage){
  var student = STATE.students[VIEW.studentId];
  if(!student) return;
  student.stageStatus[stage] = 'submitted';
  student.timeline.push({
    id: uid(), stage: stage, type:'reopen', author:'teacher', authorName: currentTeacherName(),
    ts: nowISO(), mainText: STAGE_INFO[stage].label+' 단계에 대한 재검토를 요청했습니다.', items:[], tools:[], threadRoot: null
  });
  saveState(true).then(function(){ render(); toast('다시 열었습니다.'); });
}

function doResetStudentPassword(studentId){
  var student = STATE.students[studentId];
  if(!student) return;
  var confirmReset = window.confirm(student.name+'('+student.studentId+') 학생의 비밀번호를 초기화할까요? 초기화 후 학생은 다음 입장 시 새 비밀번호를 설정하게 됩니다.');
  if(!confirmReset) return;
  student.passwordHash = null;
  student.passwordSalt = null;
  saveState(true).then(function(){ render(); toast('비밀번호가 초기화되었습니다.'); });
}

function doBulkAddStudents(){
  var lines = DRAFTS.roster.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var added = 0;
  lines.forEach(function(line){
    var parts = line.split(',');
    if(parts.length<2) return;
    var id = parts[0].trim(), name = parts.slice(1).join(',').trim();
    if(!id || !name) return;
    if(!STATE.students[id]){ STATE.students[id] = newStudent(id,name); added++; }
  });
  DRAFTS.roster = '';
  saveState(true).then(function(){ render(); toast(added+'명이 추가되었습니다.'); });
}

function doCopySummary(id){
  var text = DRAFTS.summaryOverrides[id];
  if(text===undefined) text = generateSummaryText(STATE.students[id]);
  var ta = document.createElement('textarea');
  ta.value = text.replace(/<[^>]+>/g,'');
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('복사되었습니다.'); }
  catch(err){ toast('복사에 실패했습니다. 직접 선택해 복사하세요.'); }
  document.body.removeChild(ta);
}

function doExportSummary(){
  var ids = Object.keys(STATE.students).sort();
  var lines = ids.map(function(id){
    var text = DRAFTS.summaryOverrides[id];
    if(text===undefined) text = generateSummaryText(STATE.students[id]);
    return '['+id+'] '+text;
  });
  var blob = new Blob([lines.join('\n\n')], {type:'text/plain;charset=utf-8'});
  offerDownload((STATE.meta.subjectName||'탐구활동')+'_세특요약.txt', blob);
}

/**
 * Offers a generated file to the person using this page. When the page is
 * running inside the Claude Artifact viewer, plain <a download> / blob-URL
 * clicks are inert there, so we first try the viewer's own "downloads"
 * capability (window.claude.use('downloads')). When that isn't present —
 * which is the normal case once this file is downloaded and opened directly
 * in a browser, or hosted on an ordinary web server — we fall back to the
 * classic anchor-click download, which works fine in that context.
 */
function offerDownload(filename, blob){
  function classicDownload(){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast('파일을 저장했습니다.');
    }catch(err){
      toast('파일 저장에 실패했습니다. 이 페이지를 다운로드해 직접 열어서 다시 시도해 주세요.');
    }
  }
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(function(downloads){
      if(!downloads){ classicDownload(); return; }
      downloads.save({filename: filename, data: blob}).then(function(){
        toast('저장되었습니다.');
      }).catch(function(err){
        if(err && err.code === 'declined'){ toast('저장이 취소되었습니다.'); return; }
        classicDownload();
      });
    }).catch(classicDownload);
  } else {
    classicDownload();
  }
}

function doExportState(){
  var blob = new Blob([JSON.stringify(STATE, null, 0)], {type:'application/json'});
  var d = new Date();
  var fname = (STATE.meta.subjectName||'탐구활동').replace(/[^a-zA-Z0-9가-힣]/g,'_') + '_백업_' + fmtDate(d.toISOString()).replace(/\./g,'') + '.json';
  offerDownload(fname, blob);
}

function doDownloadFileChip(el){
  var dataUrl = el.getAttribute('data-filechip-src');
  var filename = el.getAttribute('data-filechip-name') || 'file';
  fetch(dataUrl).then(function(r){ return r.blob(); }).then(function(blob){
    offerDownload(filename, blob);
  }).catch(function(){ toast('파일을 여는 중 오류가 발생했습니다.'); });
}

/* ============================== 가져오기 / 병합 ============================== */
function mergeImportedState(imported, mode){
  if(mode==='overwrite'){
    STATE = imported;
    migrateState(STATE);
    return;
  }
  migrateState(imported);
  // merge: keep local meta/deadlines, merge students + teacher roster only
  if(!STATE.students) STATE.students = {};
  if(!STATE.meta.teachers) STATE.meta.teachers = [];
  (imported.meta && imported.meta.teachers || []).forEach(function(n){
    if(STATE.meta.teachers.indexOf(n)===-1) STATE.meta.teachers.push(n);
  });
  Object.keys(imported.students||{}).forEach(function(id){
    var incoming = imported.students[id];
    var local = STATE.students[id];
    if(!local){
      STATE.students[id] = incoming;
      return;
    }
    var seen = {};
    var merged = local.timeline.concat(incoming.timeline).filter(function(en){
      if(seen[en.id]) return false;
      seen[en.id] = true; return true;
    }).sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
    local.timeline = merged;
    STAGE_ORDER.forEach(function(st){
      var a = local.stageStatus[st], b = (incoming.stageStatus||{})[st];
      if(b && stageRank(b) > stageRank(a)) local.stageStatus[st] = b;
    });
    local.presentationEligible = local.presentationEligible || incoming.presentationEligible;
    if(!local.name && incoming.name) local.name = incoming.name;
    if(!local.passwordHash && incoming.passwordHash){
      local.passwordHash = incoming.passwordHash;
      local.passwordSalt = incoming.passwordSalt;
    }
  });
}

function handleImportFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ toast('올바른 백업 파일이 아닙니다.'); return; }
    if(!data || !data.meta || !data.students){ toast('올바른 백업 파일이 아닙니다.'); return; }
    var mode = window.confirm(
      '불러오기 방식을 선택하세요.\n\n[확인] = 전체 덮어쓰기 (이 파일의 학급 설정·학생 기록으로 완전히 교체)\n[취소] = 학생 기록만 병합 (현재 설정은 유지하고 학생별 기록만 합침)'
    ) ? 'overwrite' : 'merge';
    mergeImportedState(data, mode);
    saveState(true).then(function(){
      VIEW = { screen:'home', role:null, studentId:null, teacherAuthed:false, teacherName:null };
      render();
      toast(mode==='overwrite' ? '전체 데이터를 불러왔습니다.' : '학생 기록을 병합했습니다.');
    });
  };
  reader.readAsText(file);
}

/* ============================== 초기화 ============================== */
function init(){
  document.getElementById('importFileInput').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(f) handleImportFile(f);
    e.target.value = '';
  });
  dbGet('state').then(function(saved){
    STATE = saved || defaultState();
    if(!STATE.students) STATE.students = {};
    if(!STATE.deadlines) STATE.deadlines = {stage1:null, research:null, final:null};
    if(!STATE.meta.teachers) STATE.meta.teachers = [];
    var changed = migrateState(STATE);
    if(changed){ saveState(true).then(render); } else { render(); }
  }).catch(function(){
    STATE = defaultState();
    render();
    toast('이 브라우저는 저장 기능을 지원하지 않아 새로고침 시 기록이 사라질 수 있습니다.');
  });
}
init();
})();
